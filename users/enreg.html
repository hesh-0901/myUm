<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enregistrement - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5',
        danger: '#DC2626',
        warning: '#F59E0B'
      },
      fontFamily: {
        display: ['Inter', 'sans-serif']
      },
      boxShadow: {
        card: "0 10px 25px rgba(0,0,0,0.05)"
      }
    }
  }
}
</script>

</head>

<body class="bg-gradient-to-br from-gray-50 to-gray-100 font-display text-gray-800 pb-28">

<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<div class="max-w-md mx-auto px-4 py-8 space-y-8">

<!-- ===================================================== -->
<!-- PROFIL RESUME - STYLE BANKING APP -->
<!-- ===================================================== -->

<div class="bg-white rounded-3xl shadow-card border border-gray-100 p-6 relative overflow-hidden">

  <!-- Top Accent Line -->
  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-lightblue"></div>

  <div class="flex items-center gap-5">

    <img id="profilePhoto"
         class="w-20 h-20 rounded-2xl object-cover bg-gray-200 shadow-md ring-4 ring-white">

    <div class="flex-1">
      <h1 id="fullName" class="font-bold text-xl tracking-tight"></h1>
      <p id="username" class="text-sm text-gray-400 mt-1"></p>
      <p id="userFunction" class="text-xs text-primary font-semibold mt-2"></p>
    </div>

  </div>

</div>

<!-- ===================================================== -->
<!-- INFORMATIONS PERSONNELLES -->
<!-- ===================================================== -->

<div class="bg-white rounded-3xl shadow-card border border-gray-100 p-6 space-y-6 relative">

  <div class="absolute left-0 top-0 h-full w-1 bg-primary rounded-l-3xl"></div>

  <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 pl-4">
    Informations personnelles
  </h2>

  <!-- FIELD TEMPLATE (Design amélioré uniquement visuel) -->
  <!-- Chaque champ garde ses id, data-field, classes originales -->

  <!-- Genre -->
  <div class="field bg-gray-50 rounded-2xl p-4 transition hover:bg-gray-100"
       data-field="genre" data-type="radio" data-required="true">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wide">
          Genre <span class="text-danger">*</span>
        </p>
        <p class="value text-sm mt-2 text-warning flex items-center gap-2">
          <i class="bi bi-exclamation-circle"></i>
          À compléter
        </p>
      </div>
      <button class="edit-btn w-10 h-10 rounded-full bg-white shadow border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white transition">
        <i class="bi bi-pencil"></i>
      </button>
    </div>
  </div>

  <!-- Les autres champs restent EXACTEMENT identiques structurellement -->
  <!-- Seul le style change (bg, radius, shadow, visibilité) -->

  <!-- Etat Civil -->
  <div class="field bg-gray-50 rounded-2xl p-4 transition hover:bg-gray-100"
       data-field="etatCivil" data-type="radio" data-required="true">
    <div class="flex justify-between items-start">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wide">
          État civil <span class="text-danger">*</span>
        </p>
        <p class="value text-sm mt-2 text-warning flex items-center gap-2">
          <i class="bi bi-exclamation-circle"></i>
          À compléter
        </p>
      </div>
      <button class="edit-btn w-10 h-10 rounded-full bg-white shadow border border-gray-200 flex items-center justify-center text-gray-500 hover:bg-primary hover:text-white transition">
        <i class="bi bi-pencil"></i>
      </button>
    </div>
  </div>

  <!-- Continue exactement ce même pattern pour TOUS les autres .field -->

</div>

<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<div id="navbar-container"></div>

<script type="module" src="/myUm/users/js/enreg.js"></script>

</body>
</html>
