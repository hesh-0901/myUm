<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Créer un compte - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">

<meta name="theme-color" content="#1A3668">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- Fonts -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<!-- Icons -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Tailwind -->

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#1A3668',
medium: '#2596D9',
lightblue: '#3FA9F5',
danger: '#DC2626'
},
fontFamily: {
display: ['Inter', 'sans-serif']
}
}
}
}
</script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

</head>



<body class="bg-primary min-h-screen flex justify-center overflow-x-hidden font-display">

<div class="w-full max-w-[420px] min-h-screen bg-primary text-white flex flex-col overflow-hidden">

<!-- HEADER -->

<header class="flex items-center gap-3 p-5 border-b border-white/10">

<a href="/myUm/index.html"
class="text-white/70 text-lg hover:text-white transition">

<i class="bi bi-arrow-left"></i>

</a>

<h1 class="text-lg font-semibold">
Créer un compte
</h1>

</header>



<!-- MAIN -->

<main class="flex-1 overflow-y-auto px-5 pb-20">

<form id="registerForm" class="space-y-5">

<!-- PHOTO PROFIL -->

<div class="flex flex-col items-center gap-3 mb-4">

<label class="text-xs text-white/60">
Photo de profil
</label>

<div class="relative">

<img
id="photoPreview"
src="/myUm/assets/default-avatar.png"
class="w-24 h-24 rounded-full object-cover border-2 border-white/30 shadow-md">

<label
class="absolute bottom-0 right-0 bg-gradient-to-r from-medium to-lightblue text-white rounded-full p-2.5 cursor-pointer shadow-md active:scale-95 transition">

<i class="bi bi-camera"></i>

<input
type="file"
id="photoInput"
accept="image/*"
hidden>

</label>

</div>

</div>



<!-- PRENOM -->

<div>

<label class="text-xs text-white/60 ml-1">
Prénom
</label>

<input
id="firstName"
required
autocomplete="given-name"
placeholder="Votre prénom"
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white placeholder-white/40 focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- NOM -->

<div>

<label class="text-xs text-white/60 ml-1">
Nom
</label>

<input
id="lastName"
required
autocomplete="family-name"
placeholder="Votre nom"
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white placeholder-white/40 focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- DATE -->

<div>

<label class="text-xs text-white/60 ml-1">
Date de naissance
</label>

<input
type="date"
id="birthday"
required
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- AGE -->

<div>

<label class="text-xs text-white/60 ml-1">
Âge
</label>

<input
id="age"
readonly
placeholder="Calcul automatique"
class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-base text-white">

</div>



<!-- FONCTION -->

<div>

<label class="text-xs text-white/60 ml-1">
Fonction
</label>

<select
id="fonction"
required
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

<option value="" class="text-black">Sélectionner</option>

<option class="text-black">Administrateur</option>
<option class="text-black">Corps administratif</option>
<option class="text-black">Visiteur</option>
<option class="text-black">Président</option>
<option class="text-black">Vice Président</option>
<option class="text-black">Responsable UM</option>
<option class="text-black">Comité chorale</option>
<option class="text-black">Choriste</option>
<option class="text-black">Conducteur</option>
<option class="text-black">Instrumentiste</option>

</select>

</div>



<!-- CHORALE -->

<div>

<label class="text-xs text-white/60 ml-1">
Chorale
</label>

<select
id="chorale"
required
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

<option value="" class="text-black">Sélectionner</option>

<option value="PC" class="text-black">Prophetic Choir</option>
<option value="WS" class="text-black">Wake up song</option>
<option value="VN" class="text-black">Vent Nouveau</option>
<option value="IN" class="text-black">Instrumentiste</option>
<option value="AD" class="text-black">Administration</option>
<option value="GT" class="text-black">Visiteur</option>

</select>

</div>



<!-- TELEPHONE -->

<div>

<label class="text-xs text-white/60 ml-1">
Téléphone
</label>

<input
id="phone"
required
autocomplete="tel"
placeholder="Ex : +243..."
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white placeholder-white/40 focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- PASSWORD -->

<div>

<label class="text-xs text-white/60 ml-1">
Mot de passe
</label>

<input
type="password"
id="password"
required
autocomplete="new-password"
placeholder="Votre mot de passe"
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white placeholder-white/40 focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- CONFIRM -->

<div>

<label class="text-xs text-white/60 ml-1">
Confirmer
</label>

<input
type="password"
id="confirmPassword"
required
placeholder="Confirmer le mot de passe"
class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-base text-white placeholder-white/40 focus:outline-none focus:border-lightblue focus:ring-1 focus:ring-lightblue transition">

</div>



<!-- BOUTON -->

<button
id="registerBtn"
type="submit"
class="w-full mt-4 py-3 rounded-2xl bg-gradient-to-r from-medium to-lightblue text-base font-semibold shadow-md active:scale-95 hover:opacity-90 transition">

Créer mon compte

</button>

</form>

</main>

</div>

<!-- CROP MODAL -->

<div id="cropModal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

<div class="bg-white rounded-3xl p-4 w-[90%] max-w-md">

<h2 class="text-lg font-semibold mb-3 text-black">
Ajuster la photo
</h2>

<div class="w-full h-72 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">

<img id="cropImage" class="max-w-full">

</div>

<div class="flex justify-end gap-3 mt-4">

<button id="cancelCrop"
class="px-4 py-2 text-sm bg-gray-200 rounded-lg text-black">

Annuler

</button>

<button id="confirmCrop"
class="px-4 py-2 text-sm bg-primary text-white rounded-lg">

Valider

</button>

</div>

</div>

</div>



<script type="module" src="/myUm/users/js/register.js"></script>

</body>

</html>
