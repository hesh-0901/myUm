<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon de Présence - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5',
        danger: '#DC2626'
      }
    }
  }
}
</script>
</head>

<body class="bg-gray-100 text-gray-800 font-display">
<button id="backBtn"
  class="fixed top-4 left-4 z-50 text-white/60 hover:text-white text-xl">
  <i class="bi bi-arrow-left"></i>
</button>

<div class="max-w-md mx-auto px-4 py-6 space-y-6">

  <!-- HEADER INFO -->
  <div id="roomInfo"
       class="bg-white rounded-3xl shadow-md p-5 space-y-2 hidden">
  </div>

  <!-- ENTER BUTTON -->
  <button id="enterRoomBtn"
    class="hidden w-full bg-primary text-white py-3 rounded-2xl shadow-md
           flex items-center justify-center gap-2">
    <i class="bi bi-door-open"></i>
  </button>

</div>

<!-- IMMERSIVE MODAL -->
<div id="immersiveModal"
     class="fixed inset-0 bg-black/90 hidden
            flex flex-col items-center justify-center text-white">

  <div class="text-center space-y-3 mb-8">
    <p class="text-sm opacity-70">Participants</p>
    <p id="liveCount" class="text-4xl font-bold text-green-400">0</p>
  </div>

  <!-- RADAR -->
  <div class="relative w-72 h-72 flex items-center justify-center">

    <div class="absolute w-full h-full rounded-full border border-green-400/20"></div>
    <div id="radarSweep"
         class="absolute w-full h-full rounded-full"></div>

    <button id="fingerprintBtn"
      class="w-24 h-24 rounded-full bg-gradient-to-r from-medium to-lightblue
             flex items-center justify-center shadow-xl active:scale-95 transition">
      <i class="bi bi-fingerprint text-4xl"></i>
    </button>

  </div>

  <p id="immersiveTimer"
     class="mt-8 text-lg font-semibold">00:00</p>

</div>

<style>
#radarSweep {
  background: conic-gradient(
    rgba(34,197,94,0.4) 0deg,
    rgba(34,197,94,0.2) 20deg,
    transparent 60deg
  );
  animation: rotateRadar 2s linear infinite;
}

@keyframes rotateRadar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

<script type="module" src="/myUm/users/js/presence.js"></script>
</body>
</html>
