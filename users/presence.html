<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Salon de Présence - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* ===================== */
/* ANTI SELECTION MOBILE */
/* ===================== */
*{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  overscroll-behavior:none;
}

/* ===================== */
/* HUD BACKGROUND */
/* ===================== */
#immersiveModal{
  background: radial-gradient(circle at center, #0f172a 0%, #000 80%);
}

/* ===================== */
/* PROGRESS RING */
/* ===================== */
.progress-ring{
  transform: rotate(-90deg);
}

.progress-ring circle{
  transition: stroke-dashoffset 0.1s linear;
}

/* ===================== */
/* SCAN GLOW */
/* ===================== */
.scanning{
  box-shadow: 0 0 40px rgba(37,150,217,0.9);
}

/* ===================== */
/* GLITCH EFFECT */
/* ===================== */
@keyframes glitch{
  0%{transform:translate(0)}
  20%{transform:translate(-2px,2px)}
  40%{transform:translate(-2px,-2px)}
  60%{transform:translate(2px,2px)}
  80%{transform:translate(2px,-2px)}
  100%{transform:translate(0)}
}

.glitch{
  animation:glitch 0.3s infinite;
}

</style>
</head>

<body class="text-white font-sans">

<!-- 🔙 Back minimal -->
<button id="backBtn"
class="fixed top-4 left-4 z-50 text-gray-400 text-xl">
<i class="bi bi-arrow-left"></i>
</button>

<div class="max-w-md mx-auto px-4 py-6 space-y-6">

<div id="roomInfo"
class="bg-white text-black rounded-3xl shadow-md p-5 hidden">
</div>

<button id="enterRoomBtn"
class="hidden w-full bg-blue-600 py-3 rounded-2xl shadow-md">
Entrer dans le salon
</button>

</div>

<!-- IMMERSIVE HUD -->
<div id="immersiveModal"
class="fixed inset-0 hidden flex flex-col items-center justify-center">

<p class="text-xs opacity-60 tracking-widest mb-2">PARTICIPANTS</p>
<p id="liveCount" class="text-4xl font-bold text-green-400 mb-10">0</p>

<div class="relative flex items-center justify-center">

<!-- Progress SVG -->
<svg class="progress-ring" width="220" height="220">
<circle
  stroke="#1e293b"
  stroke-width="10"
  fill="transparent"
  r="90"
  cx="110"
  cy="110"/>
<circle
  id="progressCircle"
  stroke="#38bdf8"
  stroke-width="10"
  fill="transparent"
  r="90"
  cx="110"
  cy="110"
  stroke-dasharray="565"
  stroke-dashoffset="565"/>
</svg>

<button id="fingerprintBtn"
class="absolute w-28 h-28 rounded-full bg-blue-500 flex items-center justify-center transition">
<i id="fingerIcon" class="bi bi-fingerprint text-5xl"></i>
</button>

</div>

<p id="immersiveTimer"
class="mt-10 text-lg tracking-widest">00:00</p>

</div>

<script type="module" src="/myUm/users/js/presence.js"></script>
</body>
</html>
