<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Scanner Biométrique - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* ===== ANTI-SELECTION ===== */
*{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===== HUD BACKGROUND ===== */
#immersiveModal{
  background: radial-gradient(circle at center, #0a0f1f 0%, #000 90%);
}

/* ===== PROGRESS RING ===== */
.progress-ring{
  transform: rotate(-90deg);
}

.progress-ring circle{
  transition: stroke-dashoffset 0.05s linear;
}

/* ===== LASER LINE ===== */
#laserLine{
  position:absolute;
  width:2px;
  height:180px;
  background:linear-gradient(to bottom, transparent, #38bdf8, transparent);
  animation:laserMove 2s linear infinite;
  opacity:0;
}

.scanning #laserLine{
  opacity:1;
}

@keyframes laserMove{
  0%{transform:translateY(-90px)}
  100%{transform:translateY(90px)}
}

/* ===== HUD GRID ===== */
#hudOverlay{
  position:absolute;
  width:240px;
  height:240px;
  border:1px solid rgba(56,189,248,0.3);
  border-radius:50%;
  animation:rotateHud 8s linear infinite;
}

@keyframes rotateHud{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* ===== GLOW ===== */
.scanning{
  box-shadow:0 0 60px rgba(56,189,248,0.9);
}

</style>
</head>

<body class="text-white font-sans">

<button id="backBtn"
class="fixed top-4 left-4 z-50 text-gray-400 text-xl">
<i class="bi bi-arrow-left"></i>
</button>

<div class="max-w-md mx-auto px-4 py-6 space-y-6">

<div id="roomInfo"
class="bg-white text-black rounded-3xl shadow-md p-5 hidden">
</div>

<button id="enterRoomBtn"
class="hidden w-full bg-blue-600 py-3 rounded-2xl shadow-md">
Entrer dans le salon
</button>

</div>

<!-- IMMERSIVE HUD -->
<div id="immersiveModal"
class="fixed inset-0 hidden flex flex-col items-center justify-center">

<p class="text-xs opacity-60 tracking-widest mb-2">SCAN BIOMÉTRIQUE</p>
<p id="liveCount" class="text-4xl font-bold text-green-400 mb-10">0</p>

<div class="relative flex items-center justify-center">

<div id="hudOverlay"></div>
<div id="laserLine"></div>

<svg class="progress-ring" width="240" height="240">
<circle stroke="#1e293b" stroke-width="8" fill="transparent" r="100" cx="120" cy="120"/>
<circle id="progressCircle"
stroke="#38bdf8"
stroke-width="8"
fill="transparent"
r="100"
cx="120"
cy="120"
stroke-dasharray="628"
stroke-dashoffset="628"/>
</svg>

<button id="fingerprintBtn"
class="absolute w-28 h-28 rounded-full bg-blue-500 flex items-center justify-center transition">
<i class="bi bi-fingerprint text-5xl"></i>
</button>

</div>

<p id="immersiveTimer"
class="mt-10 text-lg tracking-widest">00:00</p>

</div>

<script type="module" src="/myUm/users/js/presence.js"></script>
</body>
</html>
