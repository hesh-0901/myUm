<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
bgmain:'#011C40',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>



<body class="bg-bgmain font-display text-white pb-24">



<!-- PROFILE CARD -->
<div class="max-w-md mx-auto">

<!-- COVER -->
<div class="relative">

<img id="coverPhoto"
class="w-full h-44 object-cover">

<label for="coverInput"
class="absolute top-3 right-3
bg-black/50 text-white
w-9 h-9 rounded-full
flex items-center justify-center
cursor-pointer">

<i class="bi bi-camera"></i>

</label>

<input type="file"
id="coverInput"
accept="image/*"
class="hidden">


<!-- USER INFO -->
<div class="absolute bottom-4 left-4 text-white">

<h1 id="fullName"
class="text-xl font-semibold">
</h1>

<p id="userFunction"
class="text-sm opacity-90">
</p>

</div>

</div>



<!-- AVATAR -->
<div class="flex justify-center -mt-14">

<div class="relative">

<img id="profilePhoto"
class="w-28 h-28 rounded-full border-4 border-white object-cover bg-gray-200">

<label for="photoInput"
class="absolute bottom-1 right-1
w-9 h-9 rounded-full
bg-primary text-white
flex items-center justify-center
cursor-pointer shadow">

<i class="bi bi-camera"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>

</div>



<!-- USERNAME -->
<div class="text-center mt-3">

<p id="username"
class="text-sm text-soft">
</p>

</div>



<!-- ACTIONS -->
<div class="flex gap-3 px-4 mt-6">

<button
class="flex-1 py-2 rounded-full
bg-white text-gray-900 text-sm font-medium">

Save contact

</button>

<button
class="flex-1 py-2 rounded-full
bg-black text-white text-sm font-medium">

Exchange contact

</button>

</div>



<!-- INFOS -->
<div class="mt-6 px-4">

<h2 class="text-sm font-semibold mb-2">
My Info
</h2>

<div id="informations-container"></div>

</div>



<!-- AMIS -->
<div class="mt-6 px-4">

<div id="amis-container"></div>

</div>



<!-- NAVBAR -->
<div id="navbar-container"></div>



<script type="module" src="/myUm/users/js/profile.js"></script>


<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";

checkAuth();

async function initProfile(){

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfile();

</script>

<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
