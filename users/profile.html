<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>


<body class="bg-bgmain font-display text-soft pb-24 pt-20">


<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- PROFILE -->
<div class="max-w-md mx-auto px-4 space-y-6">

<!-- PROFILE CARD -->

<div class="bg-card rounded-3xl p-6 shadow-lg">

<div class="flex items-center gap-4">

<!-- AVATAR -->

<div class="relative">

<img id="profilePhoto"
class="w-20 h-20 rounded-full object-cover ring-4 ring-primary bg-gray-200">

<label for="photoInput"
class="absolute -bottom-1 -right-1
w-8 h-8 rounded-full
bg-primary text-white
flex items-center justify-center
cursor-pointer
shadow-lg">

<i class="bi bi-camera text-xs"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>


<!-- USER INFO -->

<div class="flex-1">

<h1 id="fullName"
class="text-lg font-semibold text-soft">
</h1>

<p id="userFunction"
class="text-xs text-accent mt-1">
</p>

<p id="username"
class="text-xs text-soft/60">
</p>

</div>

</div>


<!-- ACTION TABS -->

<div class="flex gap-3 mt-5">

<button
class="flex-1 py-2 rounded-xl bg-primary text-sm">

Achievements

</button>

<button
class="flex-1 py-2 rounded-xl bg-[#011C40] border border-primary/40 text-sm">

Notes

</button>

</div>

</div>


<!-- ABOUT -->

<div class="bg-card rounded-3xl p-5 shadow-lg">

<h2 class="text-sm font-semibold mb-3">
À propos
</h2>

<p id="userBio"
class="text-sm text-soft/80 leading-relaxed">
</p>

</div>


<!-- ACTIVITIES -->

<div class="bg-card rounded-3xl p-5 shadow-lg">

<h2 class="text-sm font-semibold mb-4">
Activités
</h2>

<div id="activitiesContainer"
class="space-y-3">

</div>

</div>


<!-- STATS -->

<div class="grid grid-cols-2 gap-4">

<div class="bg-card rounded-2xl p-4 flex items-center gap-3">

<div class="w-9 h-9 rounded-lg bg-primary/20 flex items-center justify-center">
<i class="bi bi-people"></i>
</div>

<div>
<p id="friendsCount" class="text-sm font-semibold">0</p>
<p class="text-xs text-soft/60">amis</p>
</div>

</div>


<div class="bg-card rounded-2xl p-4 flex items-center gap-3">

<div class="w-9 h-9 rounded-lg bg-accent/20 flex items-center justify-center">
<i class="bi bi-chat-square-text"></i>
</div>

<div>
<p id="postsCount" class="text-sm font-semibold">0</p>
<p class="text-xs text-soft/60">posts</p>
</div>

</div>

</div>


</div>


<!-- MODULE INFORMATIONS -->
<div id="informations-container" class="mt-6 px-4"></div>

<!-- MODULE AMIS -->
<div id="amis-container" class="mt-6 px-4"></div>


<!-- NAVBAR -->
<div id="navbar-container"></div>



<!-- CROP MODAL -->
<div id="cropModal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

<div class="bg-card rounded-3xl p-4 w-[90%] max-w-md">

<h2 class="text-lg font-semibold mb-3">
Ajuster la photo
</h2>

<div class="w-full h-72 bg-black/30 rounded-xl overflow-hidden flex items-center justify-center">
<img id="cropImage" class="max-w-full">
</div>

<div class="flex justify-end gap-3 mt-4">

<button id="cancelCrop"
class="px-4 py-2 text-sm bg-gray-600 rounded-lg">
Annuler
</button>

<button id="confirmCrop"
class="px-4 py-2 text-sm bg-primary text-white rounded-lg">
Valider
</button>

</div>

</div>

</div>



<!-- PROFILE SCRIPT -->
<script type="module" src="/myUm/users/js/profile.js"></script>


<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";
import { initHeader } from "../partials/js/header.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initProfile(){

const header = await fetch("/myUm/partials/header.html");
document.getElementById("header-container").innerHTML = await header.text();
await initHeader();

const sidebar = await fetch("/myUm/partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfile();

</script>

<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
