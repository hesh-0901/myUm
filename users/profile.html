<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- CropperJS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
theme: {
extend: {
colors: {

bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'

},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>


<body class="bg-bgmain font-display text-white pb-24">


<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- PROFILE -->
<div class="max-w-md mx-auto">


<!-- COVER -->
<div class="relative">

<img id="coverPhoto"
src="/myUm/assets/default-cover.jpg"
class="w-full h-40 object-cover">


<!-- AVATAR -->
<div class="absolute left-1/2 -bottom-14 -translate-x-1/2">

<div class="relative w-28 h-28">

<img id="profilePhoto"
class="w-28 h-28 rounded-full object-cover border-4 border-bgmain shadow-xl bg-gray-200">


<label for="photoInput"
class="absolute bottom-1 right-1 w-8 h-8 rounded-full
bg-primary flex items-center justify-center
shadow cursor-pointer">

<i class="bi bi-camera text-xs text-white"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>

</div>

</div>



<!-- USER INFOS -->
<div class="mt-20 px-6 text-center">

<h1 id="fullName"
class="text-xl font-semibold">
</h1>

<p id="userFunction"
class="text-sm text-soft mt-1">
</p>

<p id="username"
class="text-xs text-gray-400 mt-1">
</p>


<!-- BADGES -->
<div class="flex justify-center gap-2 mt-3">

<span id="roleBadge"
class="px-3 py-1 text-xs rounded-full bg-gray-200 text-gray-700 font-medium">
</span>

<span id="choraleBadge"
class="px-3 py-1 text-xs rounded-full bg-primary/10 text-primary font-medium">
</span>

</div>

</div>



<!-- STATS -->
<div class="flex justify-center gap-12 mt-6 text-center">

<div>

<p id="friendsCount"
class="text-lg font-semibold">
0
</p>

<p class="text-xs text-gray-400">
amis
</p>

</div>


<div>

<p id="postsCount"
class="text-lg font-semibold">
0
</p>

<p class="text-xs text-gray-400">
posts
</p>

</div>

</div>



<!-- INFORMATIONS MODULE -->
<div id="informations-container"
class="mt-8 px-4">
</div>


<!-- AMIS MODULE -->
<div id="amis-container"
class="mt-6 px-4">
</div>



<!-- SECURITY -->
<div class="mt-8 px-4">

<div class="bg-card rounded-2xl p-5 space-y-3">

<h2 class="text-sm font-semibold text-soft">
Sécurité du compte
</h2>


<button id="logoutBtn"
class="w-full flex items-center justify-between
p-3 rounded-xl bg-white/10">

<span class="text-sm">
Déconnexion
</span>

<i class="bi bi-box-arrow-right"></i>

</button>

</div>

</div>



<!-- NAVBAR -->
<div id="navbar-container"></div>



<!-- CROP MODAL -->
<div id="cropModal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

<div class="bg-white rounded-3xl p-4 w-[90%] max-w-md text-black">

<h2 class="text-lg font-semibold mb-3">
Ajuster la photo
</h2>

<div class="w-full h-72 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
<img id="cropImage" class="max-w-full">
</div>

<div class="flex justify-end gap-3 mt-4">

<button id="cancelCrop"
class="px-4 py-2 text-sm bg-gray-200 rounded-lg">
Annuler
</button>

<button id="confirmCrop"
class="px-4 py-2 text-sm bg-primary text-white rounded-lg">
Valider
</button>

</div>

</div>

</div>



<!-- PROFILE SCRIPT -->
<script type="module" src="/myUm/users/js/profile.js"></script>



<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initProfile() {

const sidebar = await fetch("/myUm/partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfile();

</script>


<script type="module" src="../mains.js/app-init.js"></script>


</body>
</html>
