<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- CropperJS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>


<body class="bg-bgmain font-display text-soft pb-24 pt-20">


<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>



<!-- PROFILE PAGE -->
<div class="max-w-md mx-auto px-4">

<div class="bg-white rounded-3xl p-6 shadow-md">


<!-- USER HEADER -->
<div class="flex items-center gap-4">

<!-- PROFILE PHOTO -->
<div class="relative">

<img id="profilePhoto"
class="w-24 h-24 rounded-2xl object-cover bg-gray-200">

<label for="photoInput"
class="absolute bottom-0 right-0
w-8 h-8 rounded-full
bg-primary text-white
flex items-center justify-center
shadow cursor-pointer">

<i class="bi bi-camera text-xs"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>


<!-- USER TEXT -->
<div class="flex-1">

<h1 id="fullName"
class="text-lg font-semibold text-gray-900">
</h1>

<p id="userFunction"
class="text-sm text-gray-500 mt-1">
</p>

<p id="username"
class="text-xs text-gray-400">
</p>

</div>

</div>



<!-- ACTION BUTTONS -->
<div class="flex gap-3 mt-6">

<button
class="flex-1 py-2 rounded-full
bg-gray-100 text-sm font-medium">

Achievements

</button>

<button
class="flex-1 py-2 rounded-full
bg-gray-100 text-sm font-medium">

Notes

</button>

</div>



<!-- ABOUT -->
<div class="mt-6">

<h2 class="text-sm font-semibold text-gray-900 mb-2">
About
</h2>

<p id="userBio"
class="text-sm text-gray-600 leading-relaxed">
</p>

</div>



<!-- UPCOMING ACTIVITIES -->
<div class="mt-6">

<h2 class="text-sm font-semibold text-gray-900 mb-3">
Upcoming activities
</h2>

<div id="activitiesContainer" class="space-y-3">

<!-- ACTIVITIES INJECTED BY JS -->

</div>

</div>



<!-- USER STATS -->
<div class="grid grid-cols-2 gap-4 mt-6">

<div class="flex items-center gap-3">

<div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center">
<i class="bi bi-people text-primary"></i>
</div>

<div>
<p id="friendsCount" class="text-sm font-semibold text-gray-900">0</p>
<p class="text-xs text-gray-400">amis</p>
</div>

</div>


<div class="flex items-center gap-3">

<div class="w-9 h-9 rounded-lg bg-accent/20 flex items-center justify-center">
<i class="bi bi-chat-square-text text-accent"></i>
</div>

<div>
<p id="postsCount" class="text-sm font-semibold text-gray-900">0</p>
<p class="text-xs text-gray-400">posts</p>
</div>

</div>

</div>


</div>
</div>



<!-- MODULE INFORMATIONS -->
<div id="informations-container" class="mt-6 px-4"></div>

<!-- MODULE AMIS -->
<div id="amis-container" class="mt-6 px-4"></div>



<!-- NAVBAR -->
<div id="navbar-container"></div>



<!-- CROP MODAL -->
<div id="cropModal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

<div class="bg-white rounded-3xl p-4 w-[90%] max-w-md">

<h2 class="text-lg font-semibold mb-3">
Ajuster la photo
</h2>

<div class="w-full h-72 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
<img id="cropImage" class="max-w-full">
</div>

<div class="flex justify-end gap-3 mt-4">

<button id="cancelCrop"
class="px-4 py-2 text-sm bg-gray-200 rounded-lg">
Annuler
</button>

<button id="confirmCrop"
class="px-4 py-2 text-sm bg-primary text-white rounded-lg">
Valider
</button>

</div>

</div>

</div>



<!-- PROFILE SCRIPT -->
<script type="module" src="/myUm/users/js/profile.js"></script>



<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";
import { initHeader } from "../partials/js/header.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initProfile(){

const header = await fetch("/myUm/partials/header.html");
document.getElementById("header-container").innerHTML = await header.text();
await initHeader();

const sidebar = await fetch("/myUm/partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfile();

</script>

<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
