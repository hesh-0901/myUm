<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

e

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5',
        danger: '#DC2626'
      },
      fontFamily: {
        display: ['Inter', 'sans-serif']
      }
    }e
  }
}
</script>

</head>


<body class="bg-gray-100 font-display text-gray-800 pb-24">


<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- PROFILE -->
<div class="max-w-md mx-auto">

  <div class="max-w-md mx-auto">

  <div class="bg-white rounded-3xl shadow-md overflow-hidden">

    <!-- COVER -->
    <div class="relative h-48">

      <img src="/myUm/assets/cover.jpg"
           class="w-full h-full object-cover">

      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>

      <!-- AVATAR -->
      <div class="absolute -bottom-16 left-6">

        <div class="relative w-28 h-28 group">

          <img id="profilePhoto"
               src=""
               class="w-28 h-28 rounded-full border-4 border-white 
                      object-cover shadow-xl bg-white
                      transition duration-300 group-hover:scale-105">

          <label for="photoInput"
          class="absolute bottom-1 right-1 w-9 h-9 
                 bg-primary text-white rounded-full 
                 flex items-center justify-center 
                 shadow-lg cursor-pointer 
                 hover:scale-110 active:scale-95 transition">

            <i class="bi bi-camera-fill text-sm"></i>

          </label>

          <input type="file"
                 id="photoInput"
                 accept="image/*"
                 class="hidden">

        </div>

      </div>

    </div>


    <!-- INFOS -->
    <div class="pt-20 px-6 pb-6">

      <h1 id="fullName"
      class="text-2xl font-bold text-gray-900 tracking-tight">
      </h1>

      <p id="userFunction"
      class="text-sm font-semibold text-primary mt-1">
      </p>

      <p id="username"
      class="text-sm text-gray-400 mt-1">
      </p>


      <!-- BADGES -->
      <div class="flex items-center gap-2 mt-4">

        <span id="roleBadge"
        class="px-3 py-1 text-xs rounded-full 
        bg-gray-100 text-gray-700 font-medium">
        </span>

        <span id="choraleBadge"
        class="px-3 py-1 text-xs rounded-full 
        bg-primary/10 text-primary font-medium">
        </span>

      </div>


      <!-- STATS -->
      <div class="flex items-center justify-between mt-6">

        <div class="flex items-center gap-2">

          <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center">
            <i class="bi bi-people text-primary text-sm"></i>
          </div>

          <div>
            <p id="friendsCount" class="text-sm font-semibold text-gray-900">0</p>
            <p class="text-xs text-gray-400">amis</p>
          </div>

        </div>

        <div class="flex items-center gap-2">

          <div class="w-9 h-9 rounded-lg bg-medium/10 flex items-center justify-center">
            <i class="bi bi-chat-square-text text-medium text-sm"></i>
          </div>

          <div>
            <p id="postsCount" class="text-sm font-semibold text-gray-900">0</p>
            <p class="text-xs text-gray-400">posts</p>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- MODULE INFORMATIONS -->
<div id="informations-container" class="mt-6 px-4"></div>


<!-- MODULE AMIS -->
<div id="amis-container" class="mt-6 px-4"></div>



<!-- SECURITY -->
<div class="mt-6 px-4">

  <div class="bg-white rounded-3xl shadow-md p-5 space-y-3">

    <h2 class="text-sm font-semibold text-gray-700 mb-2">
      Sécurité du compte
    </h2>

    <!-- PASSWORD -->
    <button id="changePasswordBtn"
    class="w-full flex items-center justify-between p-4 
           rounded-xl bg-gray-50 hover:bg-gray-100 transition">

      <div class="flex items-center gap-3">

        <div class="w-9 h-9 bg-primary/10 rounded-lg flex items-center justify-center">
          <i class="bi bi-key text-primary"></i>
        </div>

        <span class="text-sm">Changer mot de passe</span>

      </div>

      <i class="bi bi-chevron-right text-gray-400"></i>

    </button>


    <!-- LOGOUT -->
    <button id="logoutBtn"
    class="w-full flex items-center justify-between p-4 
           rounded-xl bg-gray-50 hover:bg-gray-100 transition">

      <div class="flex items-center gap-3">

        <div class="w-9 h-9 bg-gray-200 rounded-lg flex items-center justify-center">
          <i class="bi bi-box-arrow-right text-gray-700"></i>
        </div>

        <span class="text-sm">Déconnexion</span>

      </div>

      <i class="bi bi-chevron-right text-gray-400"></i>

    </button>


    <!-- DELETE -->
    <button id="deleteAccountBtn"
    class="w-full flex items-center justify-between p-4 
           rounded-xl bg-danger/10 text-danger hover:bg-danger/20 transition">

      <div class="flex items-center gap-3">

        <div class="w-9 h-9 bg-danger/20 rounded-lg flex items-center justify-center">
          <i class="bi bi-trash text-danger"></i>
        </div>

        <span class="text-sm font-medium">Supprimer le compte</span>

      </div>

      <i class="bi bi-chevron-right"></i>

    </button>

  </div>

</div>



<!-- NAVBAR -->
<div id="navbar-container"></div>

<div id="cropModal"
class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">

  <div class="bg-white rounded-3xl p-4 w-[90%] max-w-md">

    <h2 class="text-lg font-semibold mb-3">
      Ajuster la photo
    </h2>

    <div class="w-full h-72">
      <img id="cropImage" class="max-w-full">
    </div>

    <div class="flex justify-end gap-3 mt-4">

      <button id="cancelCrop"
      class="px-4 py-2 text-sm bg-gray-200 rounded-lg">
      Annuler
      </button>

      <button id="confirmCrop"
      class="px-4 py-2 text-sm bg-primary text-white rounded-lg">
      Valider
      </button>

    </div>

  </div>

</div>



<!-- PROFILE SCRIPT -->
<script type="module" src="/myUm/users/js/profile.js"></script>


<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";
import { initHeader } from "../partials/js/header.js";
import { initSidebar } from "../partials/js/sidebar.js";


checkAuth();


async function initProfile() {

  const header = await fetch("/myUm/partials/header.html");
  document.getElementById("header-container").innerHTML = await header.text();
  await initHeader();


  const sidebar = await fetch("/myUm/partials/sidebar.html");
  document.getElementById("sidebar-container").innerHTML = await sidebar.text();
  initSidebar();


  const nav = await fetch("/myUm/partials/nav.html");
  document.getElementById("navbar-container").innerHTML = await nav.text();


  const infos = await fetch("/myUm/partials/informations.html");
  document.getElementById("informations-container").innerHTML = await infos.text();

  await initInformations();


  const amis = await fetch("/myUm/partials/amis.html");
  document.getElementById("amis-container").innerHTML = await amis.text();

}


initProfile();

</script>


</body>
</html>
