<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - MyUm</title>

<link rel="icon" href="/myUm/assets/favicon.png">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<!-- Cropper -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<script>
tailwind.config = {
theme:{
extend:{
colors:{
bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>



<body class="bg-bgmain flex justify-center overflow-x-hidden font-display">

<!-- APP SHELL -->
<div class="w-full max-w-[420px] min-h-screen bg-bgmain flex flex-col overflow-hidden">



<!-- HEADER -->
<header class="relative">

<!-- COVER -->
<img id="coverPhoto"
src="/myUm/assets/default-cover.jpg"
class="w-full h-28 object-cover">


<!-- INFOS SUR COVER -->
<div class="absolute bottom-3 left-4 text-white">

<p class="text-xs opacity-80">Bienvenue</p>

<h1 id="fullName"
class="text-lg font-semibold leading-tight">
</h1>

<p id="userFunction"
class="text-xs text-soft">
</p>

<p id="username"
class="text-xs text-gray-300">
</p>

</div>


<!-- AVATAR -->
<div class="absolute left-1/2 -bottom-20 -translate-x-1/2">

<div class="relative w-40 h-40 flex items-center justify-center">

<!-- halo friendly -->
<div class="absolute w-44 h-44 rounded-full bg-accent/20 blur-xl"></div>

<img id="profilePhoto"
class="relative w-40 h-40 rounded-full object-cover border-4 border-bgmain shadow-xl bg-gray-200">

<label for="photoInput"
class="absolute bottom-2 right-2 w-9 h-9 rounded-full
bg-primary flex items-center justify-center shadow cursor-pointer hover:scale-110 transition">

<i class="bi bi-camera text-sm text-white"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>

</div>

</header>



<!-- MAIN -->
<main class="flex-1 overflow-y-auto pt-24 pb-24">



<!-- BADGES -->
<div class="flex justify-center gap-2">

<span id="roleBadge"
class="px-3 py-1 text-xs rounded-full bg-white/20 backdrop-blur text-white font-medium">
</span>

<span id="choraleBadge"
class="px-3 py-1 text-xs rounded-full bg-accent/30 text-white font-medium">
</span>

</div>



<!-- STATS -->
<div class="flex justify-center gap-4 mt-6 px-4">

<div class="bg-white/10 backdrop-blur-md rounded-xl px-5 py-3 text-center">

<p id="friendsCount"
class="text-lg font-semibold text-white">
0
</p>

<p class="text-xs text-gray-300">
amis
</p>

</div>


<div class="bg-white/10 backdrop-blur-md rounded-xl px-5 py-3 text-center">

<p id="postsCount"
class="text-lg font-semibold text-white">
0
</p>

<p class="text-xs text-gray-300">
posts
</p>

</div>

</div>



<!-- INFORMATIONS MODULE -->
<div id="informations-container"
class="mt-8 px-4 space-y-4">
</div>



<!-- AMIS MODULE -->
<div id="amis-container"
class="mt-6 px-4 space-y-4">
</div>



<!-- SECURITY -->
<div class="mt-8 px-4">

<div class="bg-card rounded-2xl p-5 space-y-3">

<h2 class="text-sm font-semibold text-soft">
Sécurité du compte
</h2>

<button id="logoutBtn"
class="w-full flex items-center justify-between
p-3 rounded-xl bg-white/10 hover:bg-white/20 transition">

<span class="text-sm text-white">
Déconnexion
</span>

<i class="bi bi-box-arrow-right text-white"></i>

</button>

</div>

</div>



</main>



<!-- NAVBAR -->
<footer id="navbar-container"></footer>



</div>



<!-- SIDEBAR -->
<div id="sidebar-container"></div>



<!-- CROP MODAL -->
<div id="cropModal"
class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">

<div class="bg-white rounded-3xl p-4 w-[90%] max-w-md text-black">

<h2 class="text-lg font-semibold mb-3">
Ajuster la photo
</h2>

<div class="w-full h-72 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
<img id="cropImage" class="max-w-full">
</div>

<div class="flex justify-end gap-3 mt-4">

<button id="cancelCrop"
class="px-4 py-2 text-sm bg-gray-200 rounded-lg">
Annuler
</button>

<button id="confirmCrop"
class="px-4 py-2 text-sm bg-primary text-white rounded-lg">
Valider
</button>

</div>

</div>

</div>



<!-- PROFILE SCRIPT -->
<script type="module" src="/myUm/users/js/profile.js"></script>



<!-- PAGE MODULES -->
<script type="module">

import { initInformations } from "/myUm/partials/js/informations.js";
import { initSidebar } from "/myUm/partials/js/sidebar.js";

async function initProfilePage(){

const sidebar = await fetch("/myUm/partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfilePage();

</script>



<!-- GLOBAL APP INIT -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>



</body>
</html>
