<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>


<body class="bg-bgmain font-display text-soft pb-24">


<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- COVER -->
<div class="relative w-full h-48 bg-card">

<img id="coverPhoto"
class="w-full h-full object-cover">

<label for="coverInput"
class="absolute top-3 right-3 w-9 h-9 rounded-full
bg-white/80 backdrop-blur flex items-center justify-center cursor-pointer">

<i class="bi bi-pencil text-gray-700"></i>

</label>

<input type="file"
id="coverInput"
accept="image/*"
class="hidden">

</div>



<!-- PROFILE SECTION -->
<div class="max-w-md mx-auto px-4">

<div class="bg-card rounded-3xl p-6 -mt-16 relative shadow-lg">


<!-- PROFILE PHOTO -->
<div class="flex justify-center">

<div class="relative">

<img id="profilePhoto"
class="w-32 h-32 rounded-full object-cover
border-4 border-bgmain
shadow-xl bg-gray-200">

<label for="photoInput"
class="absolute bottom-2 right-2
w-9 h-9 rounded-full
bg-primary text-white
flex items-center justify-center cursor-pointer">

<i class="bi bi-camera"></i>

</label>

<input type="file"
id="photoInput"
accept="image/*"
class="hidden">

</div>

</div>



<!-- USER TEXT -->
<div class="text-center mt-5">

<h1 id="fullName"
class="text-xl font-semibold text-soft">
</h1>

<p id="userFunction"
class="text-sm text-accent">
</p>

<p id="username"
class="text-xs text-soft/70">
</p>

</div>



<!-- STATS -->
<div class="flex justify-center gap-12 mt-6 text-center">

<div>

<p id="friendsCount"
class="text-lg font-semibold text-soft">0</p>

<p class="text-xs text-soft/60">amis</p>

</div>

<div>

<p id="postsCount"
class="text-lg font-semibold text-soft">0</p>

<p class="text-xs text-soft/60">posts</p>

</div>

</div>


</div>

</div>



<!-- MODULE INFORMATIONS -->
<div id="informations-container" class="mt-6 px-4"></div>


<!-- MODULE AMIS -->
<div id="amis-container" class="mt-6 px-4"></div>



<!-- NAVBAR -->
<div id="navbar-container"></div>



<script type="module" src="/myUm/users/js/profile.js"></script>


<script type="module">

import { initInformations } from "../partials/js/informations.js";
import { checkAuth } from "../mains.js/auth-guard.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initProfile(){

const sidebar = await fetch("/myUm/partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

const infos = await fetch("/myUm/partials/informations.html");
document.getElementById("informations-container").innerHTML = await infos.text();
await initInformations();

const amis = await fetch("/myUm/partials/amis.html");
document.getElementById("amis-container").innerHTML = await amis.text();

}

initProfile();

</script>

<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
