<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5'
      },
      fontFamily: {
        display: ['Inter', 'sans-serif']
      }
    }
  }
}
</script>

<style>

.fade-in{
animation:fadeIn .7s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

</style>

</head>


<body class="bg-primary min-h-screen font-display text-white flex flex-col">

<!-- CENTER CONTENT -->

<div class="flex flex-col flex-grow items-center justify-center fade-in">

<h1 class="text-5xl font-semibold tracking-tight">
MyUm
</h1>

</div>


<!-- BOTTOM BUTTONS -->

<div class="px-8 pb-10 space-y-4 fade-in">

<a href="users/login.html"
class="block w-full text-center py-3 rounded-xl text-sm font-medium border border-white/40 text-white hover:bg-white/10 transition active:scale-95">

Se connecter

</a>

<a href="users/register.html"
class="block w-full text-center py-3 rounded-xl text-sm font-semibold bg-gradient-to-r from-medium to-lightblue text-white shadow-lg transition active:scale-95">

Créer un compte

</a>

</div>



<!-- INSTALL MODAL -->

<div id="installModal"
class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 px-6">

<div class="w-full max-w-sm rounded-3xl p-6 text-center
bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl">

<div class="w-14 h-14 mx-auto mb-4 rounded-2xl
bg-gradient-to-br from-medium to-lightblue
flex items-center justify-center">

<i class="bi bi-phone text-xl"></i>

</div>

<h2 class="text-lg font-semibold mb-2">

Installer MyUm

</h2>

<p id="installText"
class="text-sm text-white/80 mb-5">

Installe l'application pour une meilleure expérience.

</p>

<button id="installBtn"
class="w-full py-3 rounded-xl text-sm font-semibold
bg-white text-primary hover:bg-gray-100 transition">

Installer l'application

</button>

<button id="closeInstall"
class="mt-3 text-xs text-white/70">

Plus tard

</button>

</div>

</div>



<script>

let deferredPrompt
const modal = document.getElementById("installModal")
const installBtn = document.getElementById("installBtn")
const installText = document.getElementById("installText")

/* =========================
   DETECT INSTALL
========================= */

function isStandalone(){

return window.matchMedia('(display-mode: standalone)').matches
|| window.navigator.standalone === true

}

if(!isStandalone()){

window.addEventListener("beforeinstallprompt",(e)=>{

e.preventDefault()

deferredPrompt = e

setTimeout(()=>{
modal.classList.remove("hidden")
modal.classList.add("flex")
},2000)

})

}


/* =========================
   INSTALL BUTTON
========================= */

installBtn?.addEventListener("click",async()=>{

if(!deferredPrompt) return

deferredPrompt.prompt()

const { outcome } = await deferredPrompt.userChoice

if(outcome==="accepted"){

modal.classList.add("hidden")

}

deferredPrompt=null

})


/* =========================
   IOS DETECT
========================= */

const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent)

if(isIOS && !isStandalone()){

installText.innerHTML =
'Sur iPhone :<br>Appuyez sur <b><i class="bi bi-box-arrow-up"></i> Partager</b><br>puis <b>Ajouter à l’écran d’accueil</b>'

installBtn.style.display="none"

setTimeout(()=>{
modal.classList.remove("hidden")
modal.classList.add("flex")
},2000)

}


/* =========================
   CLOSE
========================= */

document.getElementById("closeInstall").onclick=()=>{
modal.classList.add("hidden")
}

</script>


</body>
</html>
