<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">

<meta name="theme-color" content="#1A3668">

<link rel="apple-touch-icon" href="/myUm/assets/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
primary:'#1A3668',
medium:'#2596D9',
lightblue:'#3FA9F5'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

<style>

body{
overflow-x:hidden;
}

/* animation logo */

.logo-enter{
animation:logoFade 1.2s ease forwards;
}

@keyframes logoFade{

0%{
opacity:0;
transform:scale(.85);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* glass */

.glass{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.18);
}

</style>

</head>



<body class="bg-primary min-h-screen font-display text-white flex flex-col">



<!-- CENTER -->

<div class="flex flex-col flex-grow items-center justify-center">

<img
src="assets/logo.png"
class="w-40 sm:w-48 md:w-52 logo-enter"
alt="MyUm">

</div>



<!-- BUTTONS -->

<div class="px-8 pb-10 space-y-4">

<a href="users/login.html"
class="block w-full text-center py-3 rounded-xl text-sm font-medium border border-white/40 text-white hover:bg-white/10 transition active:scale-95">

Se connecter

</a>


<a href="users/register.html"
class="block w-full text-center py-3 rounded-xl text-sm font-semibold bg-gradient-to-r from-medium to-lightblue text-white shadow-lg transition active:scale-95">

Créer un compte

</a>

</div>



<!-- INSTALL MODAL -->

<div id="installModal"
class="fixed inset-0 hidden items-center justify-center px-6 z-50">

<div
class="glass rounded-3xl p-6 text-center max-w-sm w-full text-white shadow-xl">

<div class="text-3xl mb-3">
<i class="bi bi-download"></i>
</div>

<h2 class="text-lg font-semibold mb-2">
Installer MyUm
</h2>

<p id="installText" class="text-sm text-white/80 mb-5">
Installer l'application sur votre appareil
</p>

<button id="installBtn"
class="w-full py-3 rounded-xl bg-gradient-to-r from-medium to-lightblue font-semibold shadow-lg active:scale-95 transition">

Installer

</button>

<button id="closeModal"
class="w-full mt-3 py-2 text-sm text-white/70">

Plus tard

</button>

</div>

</div>

<script>

/* ======================
REGISTER SERVICE WORKER
====================== */

if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("/myUm/sw.js")
.then(()=>console.log("SW ready"))
.catch(err=>console.log("SW error:",err));
}


/* ======================
PWA INSTALL SYSTEM
====================== */

let deferredPrompt;

const modal = document.getElementById("installModal");
const installBtn = document.getElementById("installBtn");
const installText = document.getElementById("installText");
const closeModal = document.getElementById("closeModal");


/* ======================
DEVICE DETECTION
====================== */

function isIOS(){
return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function isStandalone(){
return window.matchMedia("(display-mode: standalone)").matches
|| window.navigator.standalone === true;
}


/* ======================
SHOW MODAL
====================== */

window.addEventListener("load",()=>{

if(isStandalone()) return;

/* IOS */

if (isIOS()) {

installBtn.style.display = "none";

installText.innerHTML =
"Pour installer l'app :<br><br><i class='bi bi-box-arrow-up'></i> puis <b>Ajouter à l’écran d’accueil</b>";

modal.classList.remove("hidden");
modal.classList.add("flex");

return;

}

/* ANDROID / WINDOWS */

modal.classList.remove("hidden");
modal.classList.add("flex");

});


/* ======================
CAPTURE INSTALL EVENT
====================== */

window.addEventListener("beforeinstallprompt",(e)=>{

console.log("PWA install available");

e.preventDefault();

deferredPrompt = e;

});


/* ======================
INSTALL BUTTON
====================== */

installBtn.addEventListener("click", async ()=>{

if(deferredPrompt){

deferredPrompt.prompt();

const choice = await deferredPrompt.userChoice;

console.log("Install result:",choice.outcome);

modal.classList.add("hidden");

deferredPrompt = null;

return;

}

/* FALLBACK SI NAVIGATEUR */

alert("Utilisez le menu du navigateur puis 'Installer l'application'.");

});


/* ======================
CLOSE MODAL
====================== */

closeModal.addEventListener("click",()=>{

modal.classList.add("hidden");

});

</script>

</body>
</html>
