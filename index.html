<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config={
theme:{
extend:{
colors:{
primary:'#1A3668',
medium:'#2596D9',
lightblue:'#3FA9F5'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

<style>

.logo-animation{
animation:logoFade 1.2s ease;
}

@keyframes logoFade{
0%{opacity:0;transform:scale(.92)}
100%{opacity:1;transform:scale(1)}
}

.glass{
backdrop-filter:blur(18px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.18);
}

</style>

</head>


<body class="bg-primary min-h-screen font-display text-white flex flex-col overflow-hidden">


<!-- CENTER CONTENT -->

<div class="flex flex-col flex-grow items-center justify-center gap-6">

<img
src="assets/logo.png"
class="w-40 sm:w-44 md:w-48 lg:w-52 logo-animation select-none pointer-events-none"
alt="MyUm Logo">

</div>


<!-- BOTTOM BUTTONS -->

<div class="px-8 pb-10 space-y-4">

<a href="users/login.html"
class="block w-full text-center py-3 rounded-xl text-sm font-medium border border-white/40 text-white hover:bg-white/10 transition active:scale-95">

Se connecter

</a>


<a href="users/register.html"
class="block w-full text-center py-3 rounded-xl text-sm font-semibold bg-gradient-to-r from-medium to-lightblue text-white shadow-lg transition active:scale-95">

Créer un compte

</a>

</div>


<!-- INSTALL MODAL -->

<div id="installModal"
class="fixed inset-0 hidden items-center justify-center p-6 z-50">

<div
class="glass rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">

<div class="flex justify-center mb-4">

<div class="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center">

<i class="bi bi-download text-2xl"></i>

</div>

</div>

<h2 class="text-lg font-semibold mb-2">

Installer MyUm

</h2>

<p id="installText"
class="text-sm text-white/80 mb-5">

Installer l'application pour une expérience plus rapide.

</p>

<div class="space-y-3">

<button id="installBtn"
class="w-full py-3 rounded-xl bg-gradient-to-r from-medium to-lightblue font-semibold shadow-lg active:scale-95 transition">

Installer

</button>

<button id="closeInstall"
class="w-full py-3 rounded-xl text-sm text-white/70 border border-white/20 active:scale-95 transition">

Plus tard

</button>

</div>

</div>

</div>



<script>

let deferredPrompt=null

const modal=document.getElementById("installModal")
const installBtn=document.getElementById("installBtn")
const closeBtn=document.getElementById("closeInstall")
const installText=document.getElementById("installText")


function isStandalone(){

return window.matchMedia('(display-mode: standalone)').matches
|| window.navigator.standalone

}


function isiOS(){

return /iphone|ipad|ipod/i.test(window.navigator.userAgent)

}


window.addEventListener("beforeinstallprompt",(e)=>{

e.preventDefault()

if(isStandalone()) return

deferredPrompt=e

modal.classList.remove("hidden")
modal.classList.add("flex")

})


if(isiOS() && !isStandalone()){

installText.innerHTML=
`
Sur iPhone :

<br><br>

<i class="bi bi-box-arrow-up text-lg"></i>
Appuyez sur <b>Partager</b> puis

<br>

<i class="bi bi-plus-square text-lg"></i>
<b>Sur l'écran d'accueil</b>
`

modal.classList.remove("hidden")
modal.classList.add("flex")

installBtn.style.display="none"

}


installBtn?.addEventListener("click",async()=>{

if(!deferredPrompt) return

deferredPrompt.prompt()

await deferredPrompt.userChoice

modal.classList.add("hidden")

})


closeBtn?.addEventListener("click",()=>{

modal.classList.add("hidden")

})


</script>


</body>
</html>
