<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification Profil | MyUM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Segoe UI",Arial,sans-serif;

background:
radial-gradient(circle at 20% 20%, #1f3c88, transparent 40%),
radial-gradient(circle at 80% 0%, #00c6ff, transparent 35%),
#0f172a;

color:white;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:20px;

}

/* CARD */

.card{

width:100%;
max-width:420px;

background:rgba(255,255,255,0.05);

backdrop-filter:blur(16px);

border-radius:16px;

padding:35px;

text-align:center;

box-shadow:
0 0 50px rgba(0,150,255,0.15);

animation:fadeIn .6s ease;

}

/* HEADER */

header{
margin-bottom:20px;
}

header h1{
font-size:21px;
font-weight:600;
letter-spacing:.5px;
}

.subtitle{
font-size:13px;
opacity:.7;
margin-top:4px;
}

/* STATUS */

.status{
margin:18px 0;
font-size:14px;
}

.status.loading{
color:#7dd3fc;
}

.status.success{
color:#4ade80;
}

.status.error{
color:#f87171;
}

/* AVATAR */

.avatar{

width:110px;
height:110px;

border-radius:50%;
object-fit:cover;

margin:18px auto;

display:block;

border:3px solid rgba(255,255,255,0.2);

box-shadow:
0 0 25px rgba(0,200,255,0.6),
0 0 45px rgba(0,150,255,0.25);

}

/* NAME */

.name{
font-size:24px;
font-weight:700;
margin-top:10px;
}

/* ROLE */

.role{
font-size:14px;
opacity:.85;
margin-top:4px;
}

/* USERNAME */

.username{
font-size:13px;
opacity:.65;
margin-top:6px;
}

/* VERIFIED BADGE */

.badge{

display:inline-block;

margin-top:16px;

padding:7px 16px;

border-radius:30px;

font-size:13px;
font-weight:600;

background:linear-gradient(90deg,#22c55e,#4ade80);

color:#052e16;

}

/* FOOTER */

.footer{

margin-top:26px;

font-size:11px;

opacity:.6;

}

/* ANIMATION */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<main>

<div class="card">

<header>

<h1>Vérification MyUM</h1>
<p class="subtitle">Authenticité du profil</p>

</header>

<div id="status" class="status loading">
Analyse du profil...
</div>

<section id="profile"></section>

<div class="footer">
Document sécurisé MyUM
</div>

</div>

</main>

<script type="module" src="/mains.js/verify.js"></script>

</body>

</html>
