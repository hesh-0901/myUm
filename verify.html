<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

</head>



<body class="bg-gray-100 flex justify-center overflow-x-hidden font-[Inter]">


<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">


<!-- HEADER -->

<header class="p-4 text-center border-b">

<img
src="/myUm/assets/logo-myum.png"
class="w-32 mx-auto mb-2">

<h1 class="text-lg font-semibold text-primary">
Vérification du document
</h1>

</header>


<!-- MAIN -->

<main class="flex-1 p-5 space-y-6">


<!-- STATUS -->

<div id="verifyStatus"
class="rounded-3xl shadow-sm p-6 text-center border space-y-4">

<p class="text-gray-500">
Vérification en cours...
</p>

</div>


<!-- PROFILE CARD -->

<div id="profileCard"
class="hidden rounded-3xl shadow-sm p-5 border space-y-4">


<div class="flex items-center gap-4">

<img
id="photo"
class="w-16 h-16 rounded-full object-cover bg-gray-200">

<div>

<h2
id="name"
class="font-semibold text-gray-800">
</h2>

<p
id="username"
class="text-sm text-gray-500">
</p>

<p
id="fonction"
class="text-xs text-medium font-semibold">
</p>

</div>

</div>


<div class="border-t pt-4 text-sm space-y-2">

<p>
<strong>Commune :</strong>
<span id="commune"></span>
</p>

<p>
<strong>Genre :</strong>
<span id="genre"></span>
</p>

<p>
<strong>Etat civil :</strong>
<span id="etatCivil"></span>
</p>

<p>
<strong>Registre :</strong>
<span id="registreVoix"></span>
</p>

</div>

</div>


</main>


<!-- FOOTER -->

<footer class="text-center text-xs text-gray-400 p-4 border-t">

Document vérifié via MyUm

</footer>


</div>



<!-- VERIFY SCRIPT -->

<script type="module">

import { db } from "/myUm/mains.js/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

init();


async function init(){

const params = new URLSearchParams(window.location.search);

const uid = params.get("uid");

if(!uid){

showError("Document invalide");

return;

}

try{

const snap = await getDoc(doc(db,"users",uid));

if(!snap.exists()){

showError("Document non reconnu");

return;

}

showValid(snap.data());

}

catch(e){

showError("Erreur de vérification");

}

}



function showValid(data){

document.getElementById("verifyStatus").innerHTML = `

<div class="flex flex-col items-center gap-2">

<i class="bi bi-patch-check-fill text-green-500 text-5xl"></i>

<span class="text-green-600 font-semibold">
Document vérifié
</span>

<p class="text-sm text-gray-500">
Ce document appartient à un utilisateur MyUm.
</p>

</div>

`;

const card = document.getElementById("profileCard");

card.classList.remove("hidden");

document.getElementById("photo").src =
data.photoURL || "https://via.placeholder.com/150";

document.getElementById("name").innerText =
`${data.firstName} ${data.lastName}`;

document.getElementById("username").innerText =
`@${data.username}`;

document.getElementById("fonction").innerText =
data.fonction || "";

document.getElementById("commune").innerText =
data.commune || "-";

document.getElementById("genre").innerText =
data.genre || "-";

document.getElementById("etatCivil").innerText =
data.etatCivil || "-";

document.getElementById("registreVoix").innerText =
data.registreVoix || "-";

}



function showError(msg){

document.getElementById("verifyStatus").innerHTML = `

<div class="flex flex-col items-center gap-2">

<i class="bi bi-x-circle-fill text-red-500 text-5xl"></i>

<span class="text-red-600 font-semibold">
Document invalide
</span>

<p class="text-sm text-gray-500">
${msg}
</p>

</div>

`;

}

</script>


</body>
</html>
