<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vérification MyUm</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="bg-gray-100 flex justify-center">

<div class="w-full max-w-[420px] min-h-screen bg-white p-6 space-y-6">


<div class="text-center space-y-3">

<img src="/myUm/assets/logo-myum.png" class="w-32 mx-auto">

<h1 class="text-xl font-semibold">
Vérification du document
</h1>

</div>


<div id="verifyStatus"
class="text-center space-y-3">

<p class="text-gray-500">
Vérification en cours...
</p>

</div>


<div id="profileCard"
class="hidden rounded-3xl shadow-sm p-5 border space-y-4">

<div class="flex items-center gap-4">

<img id="photo"
class="w-16 h-16 rounded-full">

<div>

<h2 id="name"
class="font-semibold"></h2>

<p id="username"
class="text-sm text-gray-500"></p>

<p id="fonction"
class="text-xs text-medium"></p>

</div>

</div>

</div>


</div>

<script type="module" src="/myUm/verify.js"></script>

</body>
</html>
