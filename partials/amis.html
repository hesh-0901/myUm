<div class="bg-card rounded-2xl shadow-lg p-5 space-y-5">

  <!-- HEADER -->
  <div class="flex items-center justify-between border-b border-white/10 pb-3">

    <h2 class="text-sm font-semibold text-soft flex items-center gap-2">
      <i class="bi bi-people-fill text-accent"></i>
      Amis
    </h2>

    <span id="friendsCount"
          class="text-xs bg-accent/20 text-accent px-2 py-1 rounded-full">
      0
    </span>

  </div>


  <!-- TABS -->
  <div class="flex bg-white/5 rounded-xl p-1 text-xs font-medium">

    <button class="flex-1 py-2 rounded-lg bg-card text-soft shadow-sm tab-btn"
            data-tab="friendsTab">
      Amis
    </button>

    <button class="flex-1 py-2 rounded-lg text-gray-400 hover:text-soft transition tab-btn"
            data-tab="requestsTab">
      Demandes
    </button>

    <button class="flex-1 py-2 rounded-lg text-gray-400 hover:text-soft transition tab-btn"
            data-tab="discoverTab">
      Découvrir
    </button>

  </div>


  <!-- ===================== -->
  <!-- AMIS -->
  <!-- ===================== -->
  <div id="friendsTab" class="space-y-4">

    <div id="friendsList" class="space-y-3">
      <!-- Amis injectés dynamiquement -->
    </div>

  </div>


  <!-- ===================== -->
  <!-- DEMANDES -->
  <!-- ===================== -->
  <div id="requestsTab" class="hidden space-y-4">

    <div id="requestsList" class="space-y-3">
      <!-- Demandes injectées dynamiquement -->
    </div>

  </div>


  <!-- ===================== -->
  <!-- DECOUVRIR -->
  <!-- ===================== -->
  <div id="discoverTab" class="hidden space-y-4">

    <!-- RECHERCHE -->
    <div class="relative">

      <i class="bi bi-search absolute left-3 top-3 text-gray-400 text-sm"></i>

      <input type="text"
             id="searchUserInput"
             placeholder="Rechercher un utilisateur"
             class="w-full pl-9 pr-4 py-2 text-sm rounded-xl
                    bg-white/5 border border-white/10
                    text-white placeholder-gray-400
                    focus:outline-none focus:border-accent">

    </div>

    <div id="discoverList" class="space-y-3">
      <!-- Suggestions dynamiques -->
    </div>

  </div>

</div>
