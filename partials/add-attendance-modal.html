<div id="attendanceModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl p-5 space-y-4">

    <!-- HEADER -->
    <div class="flex justify-between items-center">
      <p class="text-lg font-semibold">Ajouter présence</p>
      <button id="closeAttendanceModal" class="text-gray-400">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- CONTROLS -->
    <div class="flex gap-2">

      <!-- CHORALE -->
      <select id="choraleFilter"
      class="p-2 rounded-xl border text-xs">
        <option value="all">Toute</option>
        <option value="PC">PC</option>
        <option value="VN">VN</option>
        <option value="WS">WS</option>
      </select>

      <!-- TYPE -->
      <select id="searchType"
      class="p-2 rounded-xl border text-xs">
        <option value="name">Nom</option>
        <option value="id">ID</option>
      </select>

      <!-- INPUT -->
      <input id="attendanceSearch"
      placeholder="Rechercher..."
      class="flex-1 p-2 rounded-xl border text-xs">

    </div>

    <!-- RESULTS -->
    <div id="attendanceResults"
    class="max-h-60 overflow-y-auto space-y-2"></div>

  </div>

</div>
