<div id="attendanceModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl p-5 space-y-4">

    <!-- HEADER -->
    <div class="flex justify-between items-center">
      <p class="text-lg font-semibold">Ajouter présence</p>
      <button id="closeAttendanceModal" class="text-gray-400">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- SEARCH -->
    <input
      id="attendanceSearch"
      placeholder="Rechercher choriste..."
      class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-primary">

    <!-- LIST -->
    <div id="attendanceResults" class="max-h-60 overflow-y-auto space-y-2"></div>

  </div>

</div>
