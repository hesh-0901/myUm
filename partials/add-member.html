<div id="addMemberModal"
  class="fixed inset-0 hidden z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-5">

    <div class="flex justify-between items-center">
      <h3 class="text-lg font-semibold">Ajouter un participant</h3>
      <button id="closeAddMember"
        class="text-gray-400 hover:text-gray-700">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="space-y-3">
      <input type="text"
        id="manualUsername"
        placeholder="Username"
        class="w-full border rounded-xl px-4 py-2 text-sm">
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button id="cancelAddMember"
        class="px-4 py-2 rounded-xl border text-sm">
        Annuler
      </button>
      <button id="confirmAddMember"
        class="px-4 py-2 rounded-xl bg-primary text-white text-sm shadow">
        Ajouter
      </button>
    </div>

  </div>
</div>
