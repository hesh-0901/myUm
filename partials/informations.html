<div class="bg-white rounded-3xl shadow-md p-5 space-y-5">

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <h2 class="font-semibold text-sm">Mes informations</h2>
  </div>

  <!-- BIO -->
  <div class="flex items-start justify-between group">

    <div class="flex-1">
      <p class="text-xs text-gray-500">Bio</p>
      <p id="info-bio" class="text-sm mt-1">—</p>
    </div>

    <!-- ✅ Pencil conservé -->
    <button class="edit-btn text-gray-400 hover:text-primary transition"
            data-field="bio">
      <i class="bi bi-pencil"></i>
    </button>

  </div>

  <!-- TELEPHONE -->
  <div class="flex items-center justify-between group">

    <div>
      <p class="text-xs text-gray-500">Téléphone</p>
      <p id="info-phone" class="text-sm mt-1">—</p>
    </div>

    <!-- ✅ Pencil conservé -->
    <button class="edit-btn text-gray-400 hover:text-primary transition"
            data-field="phone">
      <i class="bi bi-pencil"></i>
    </button>

  </div>

  <!-- DATE DE NAISSANCE -->
  <div>
    <p class="text-xs text-gray-500">Date de naissance</p>
    <p id="info-birthday" class="text-sm mt-1">—</p>
  </div>

  <!-- AGE -->
  <div>
    <p class="text-xs text-gray-500">Âge</p>
    <p id="info-age" class="text-sm mt-1">—</p>
  </div>

  <!-- FONCTION -->
  <div>
    <p class="text-xs text-gray-500">Fonction</p>
    <p id="info-fonction" class="text-sm mt-1">—</p>
  </div>

  <!-- VOIR PLUS -->
  <div class="pt-4 border-t">

    <a href="/myUm/users/enreg.html"
       class="w-full flex items-center justify-between p-3
              rounded-xl bg-gray-50 hover:bg-gray-100 transition text-sm">

      <span>Voir plus</span>
      <i class="bi bi-chevron-right text-gray-400"></i>

    </a>

  </div>

</div>
