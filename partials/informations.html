<head>

<style>
.bio-collapsed{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
</style>

</head>

<div class="bg-card rounded-2xl p-5 shadow-lg space-y-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between border-b border-white/10 pb-3">

    <h2 class="text-sm font-semibold text-soft flex items-center gap-2">
      <i class="bi bi-person-lines-fill text-accent"></i>
      Mes informations
    </h2>

  </div>


  <!-- BIO -->
<div class="flex items-start justify-between group">

  <div class="flex-1">

    <p class="text-xs text-gray-400">
      Bio
    </p>

  <p id="info-bio"
   class="text-sm text-white mt-1 bio-collapsed">
      —
    </p>

    <button id="bio-toggle"
            class="text-xs text-accent mt-1 hidden">
      Voir plus
    </button>

  </div>

  <button class="edit-btn text-gray-400 hover:text-accent transition"
          data-field="bio">
    <i class="bi bi-pencil"></i>
  </button>

</div>

  <!-- TELEPHONE -->
  <div class="flex items-center justify-between group">

    <div>

      <p class="text-xs text-gray-400">
        Téléphone
      </p>

      <p id="info-phone"
         class="text-sm text-white mt-1">
        —
      </p>

    </div>

    <button class="edit-btn text-gray-400 hover:text-accent transition"
            data-field="phone">

      <i class="bi bi-pencil"></i>

    </button>

  </div>


  <!-- DATE DE NAISSANCE -->
  <div>

    <p class="text-xs text-gray-400">
      Date de naissance
    </p>

    <p id="info-birthday"
       class="text-sm text-white mt-1">
      —
    </p>

  </div>


  <!-- AGE -->
  <div>

    <p class="text-xs text-gray-400">
      Âge
    </p>

    <p id="info-age"
       class="text-sm text-white mt-1">
      —
    </p>

  </div>


  <!-- FONCTION -->
  <div>

    <p class="text-xs text-gray-400">
      Fonction
    </p>

    <p id="info-fonction"
       class="text-sm text-white mt-1">
      —
    </p>

  </div>


  <!-- VOIR PLUS -->
  <div class="pt-4 border-t border-white/10">

    <a href="/myUm/users/enreg.html"
       class="w-full flex items-center justify-between p-3
              rounded-xl bg-white/5 hover:bg-white/10
              transition text-sm text-soft">

      <span>
        Voir plus
      </span>

      <i class="bi bi-chevron-right text-gray-400"></i>

    </a>

  </div>

</div>
