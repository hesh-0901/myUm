<div class="bg-white rounded-3xl shadow-md p-5 space-y-5">

  <!-- HEADER -->

    <h2 class="font-semibold text-sm">Mes informations</h2>
  </div>

  <!-- ======================== -->
  <!-- BIO -->
  <!-- ======================== -->

      <p id="info-bio" class="text-sm mt-1">—</p>
    </div>

    </button>

  </div>
