<div id="choristeStatusContainer" class="space-y-2">

  <!-- CURRENT STATUS -->
  <div id="currentStatus"
    class="flex items-center justify-between p-3 rounded-xl bg-white/5 border border-white/10 cursor-pointer">

    <div class="flex items-center gap-3">
      <i id="statusIcon" class="bi bi-check-circle-fill text-green-500"></i>
      <span id="statusText" class="text-sm text-soft">Actif</span>
    </div>

    <i class="bi bi-chevron-down text-gray-400 text-xs"></i>

  </div>

  <!-- OPTIONS (hidden by default) -->
  <div id="statusOptions" class="hidden space-y-2">

    <div class="status-option flex items-center gap-3 p-3 rounded-xl bg-white/5"
      data-status="Actif">
      <i class="bi bi-check-circle-fill text-green-500"></i>
      <span class="text-sm text-soft">Actif</span>
    </div>

    <div class="status-option flex items-center gap-3 p-3 rounded-xl bg-white/5"
      data-status="Suspendu">
      <i class="bi bi-pause-circle-fill text-red-500"></i>
      <span class="text-sm text-soft">Suspendu</span>
    </div>

    <div class="status-option flex items-center gap-3 p-3 rounded-xl bg-white/5"
      data-status="En déplacement">
      <i class="bi bi-geo-alt-fill text-blue-500"></i>
      <span class="text-sm text-soft">En déplacement</span>
    </div>

    <div class="status-option flex items-center gap-3 p-3 rounded-xl bg-white/5"
      data-status="Repos autorisé">
      <i class="bi bi-moon-fill text-purple-500"></i>
      <span class="text-sm text-soft">Repos autorisé</span>
    </div>

  </div>

</div>
