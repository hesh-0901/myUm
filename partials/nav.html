<script>

function getBasePath() {

  const { pathname } = window.location;

  const parts = pathname.split("/").filter(Boolean);

  const isGitHubIO = window.location.hostname.includes("github.io");

  if (isGitHubIO && parts.length > 0) {
    return "/" + parts[0] + "/";
  }

  return "/";

}

function goTo(path) {

  const base = getBasePath();

  window.location.href = base + path;

}


/* NAV ACTIVE */

const path = window.location.pathname;

let current = "";

if (path.includes("dashboard")) current = "dashboard";
if (path.includes("posts")) current = "posts";
if (path.includes("chat")) current = "chat";
if (path.includes("profile")) current = "profile";

document.querySelectorAll(".nav-item").forEach(btn => {

  if (btn.dataset.page === current) {

    btn.classList.remove("text-gray-400");
    btn.classList.add("text-primary");

  }

});

</script>
