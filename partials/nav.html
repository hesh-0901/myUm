                rounded-2xl
                shadow-lg">

      <div class="flex justify-between items-center px-8 py-3 text-gray-400 text-lg">

        <!-- Accueil -->
        <button data-page="dashboard"
          onclick="goTo('public/dashboard.html')"
          class="nav-item transition duration-200 active:scale-90">

          <i class="bi bi-house-door"></i>

        </button>

        <!-- Posts -->
        <button data-page="posts"
          onclick="goTo('posts/index.html')"

        <!-- Chat -->

        <!-- Profil -->

          onclick="goTo('users/profile.html')"

      <!-- BOUTON CENTRAL PRESENCE -->
      <div class="absolute -top-6 left-1/2 -translate-x-1/2">

<script>
function getBasePath() {
  const { pathname } = window.location;
  const parts = pathname.split("/").filter(Boolean);
  const isGitHubIO = window.location.hostname.includes("github.io");

  if (isGitHubIO && parts.length > 0) {
    return "/" + parts[0] + "/";
  }

  return "/";
}

function goTo(path) {
  const base = getBasePath();
  window.location.href = base + path;
}

/* NAV ACTIVE */

const path = window.location.pathname;

let current = "";

if (path.includes("dashboard")) current = "dashboard";
if (path.includes("posts")) current = "posts";
if (path.includes("chat")) current = "chat";
if (path.includes("profile")) current = "profile";

document.querySelectorAll(".nav-item").forEach(btn => {

  if (btn.dataset.page === current) {

    btn.classList.remove("text-gray-400");
    btn.classList.add("text-primary");

  }

});
</script>
