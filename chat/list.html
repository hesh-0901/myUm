<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversations - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1A3668', medium:'#2596D9', lightblue:'#3FA9F5' },
        fontFamily: { display:['Inter','sans-serif'] }
      } }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">
  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col">

    <!-- ===============================
         HEADER
    ================================= -->
    <header class="sticky top-0 bg-white border-b border-gray-100 z-10">
      <div class="px-4 py-3 flex items-center justify-between">
        <button id="backBtn" class="text-sm font-semibold text-primary">← Chat</button>
        <div class="font-semibold">Conversations</div>
        <button id="refreshBtn" class="text-sm font-semibold text-primary">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>

      <div class="px-4 pb-3">
        <input id="filterInput"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue"
               placeholder="Filtrer…" />
      </div>
    </header>

    <!-- ===============================
         LIST
    ================================= -->
    <main class="flex-1 p-4">
      <div id="chatList" class="space-y-2"></div>

      <div id="emptyState" class="hidden text-center text-sm text-gray-500 mt-8">
        Aucune conversation.
      </div>
    </main>

    <footer class="py-5 text-center text-xs text-gray-400">MyUm • Conversations</footer>
  </div>

  <script type="module" src="../mains.js/app-init.js"></script>
  <script type="module" src="./js/chat-list.js"></script>
</body>
</html>
