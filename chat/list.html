<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversations | MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: { display: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">

  <!-- TOP BAR -->
  <div class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <button id="backBtn"
        class="w-10 h-10 rounded-xl bg-gray-100 text-gray-700 flex items-center justify-center active:scale-95 transition">
        <i class="bi bi-arrow-left"></i>
      </button>

      <div class="min-w-0 flex-1">
        <div class="font-bold text-sm text-gray-800 truncate">Conversations</div>
        <div class="text-xs text-gray-500 truncate">Discussions récentes</div>
      </div>

      <button id="dashBtn"
        class="w-10 h-10 rounded-xl bg-gray-100 text-gray-700 flex items-center justify-center active:scale-95 transition"
        title="Dashboard">
        <i class="bi bi-house-door"></i>
      </button>
    </div>
  </div>

  <main class="max-w-md mx-auto px-4 py-5 space-y-4 pb-10">

    <!-- Search (local filter) -->
    <div class="bg-white rounded-3xl shadow-md p-4 border border-gray-100">
      <div class="flex items-center gap-2">
        <i class="bi bi-search text-gray-500"></i>
        <input id="filterInput"
          class="flex-1 bg-transparent outline-none text-sm"
          placeholder="Filtrer par nom / username…" />
      </div>
    </div>

    <!-- Chats list -->
    <section class="bg-white rounded-3xl shadow-md p-4 border border-gray-100">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold text-sm text-primary">Mes conversations</h2>
        <button id="refreshBtn"
          class="text-xs px-3 py-2 rounded-xl bg-gray-100 active:scale-95 transition">
          Rafraîchir
        </button>
      </div>

      <div id="chatList" class="space-y-2"></div>

      <div id="emptyState" class="text-sm text-gray-500 text-center py-6 hidden">
        Aucune conversation pour l’instant.
      </div>
    </section>

  </main>

  <!-- GitHub Pages base helper -->
  <script>
    function getBasePath() {
      const { pathname } = window.location;
      const parts = pathname.split("/").filter(Boolean);
      if (window.location.hostname.includes("github.io") && parts.length > 0) {
        return "/" + parts[0] + "/";
      }
      return "/";
    }
    function goTo(path) {
      window.location.href = getBasePath() + path;
    }
  </script>

  <script type="module" src="../mains.js/auth-guard.js"></script>
  <script type="module" src="js/chat-list.js"></script>
</body>
</html>
