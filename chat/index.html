<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="module">
  import { db } from "../mains.js/firebase-config.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  async function blockIfMaintenance() {
    try {
      const user = JSON.parse(localStorage.getItem("myum_user"));
      const myId = user?.id;

      const snap = await getDoc(doc(db, "config", "app"));

      if (!snap.exists()) return;

      const data = snap.data();

      const isMaintenance = data.chatMaintenance === true;

      const ADMIN_ID = "TON_ID";

      if (isMaintenance && myId !== ADMIN_ID) {
        window.location.href = "/myUm/chat/maintenance.html";
      }

    } catch (e) {
      console.error("Maintenance check fail:", e);
    }
  }

  await blockIfMaintenance();
</script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: {
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800 flex justify-center overflow-x-hidden">
  <!-- ============================================================
       APP SHELL
       Rôle :
       - Conteneur mobile-first principal
       - Page dédiée uniquement aux conversations
  ============================================================ -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

    <!-- ============================================================
         HEADER
         Rôle :
         - Retour dashboard
         - Titre
         - Accès page amis avec badge requests
    ============================================================ -->
    <header class="sticky top-0 z-20 bg-white border-b border-gray-100">
      <div class="px-4 py-3 flex items-center justify-between gap-3">
        <button id="backDashboardBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="min-w-0 flex-1">
          <div class="font-semibold text-sm truncate">Messagerie</div>
          <div class="text-xs text-gray-400 truncate">Vos conversations</div>
        </div>

        <!-- Bouton amis -->
        <button id="friendsPageBtn"
          class="relative w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-people-fill"></i>

          <span id="friendRequestsBadge"
            class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">
            0
          </span>
        </button>
      </div>

      <!-- ============================================================
           RECHERCHE CONVERSATIONS / PERSONNES
           Rôle :
           - Recherche discrète
           - Pas de double loupe inutile
      ============================================================ -->
      <div class="px-4 pb-3">
        <div class="relative">
          <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input id="conversationSearchInput"
            class="w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue text-sm bg-gray-50"
            placeholder="Rechercher une conversation..." />
        </div>
      </div>
    </header>

    <!-- ============================================================
         ACTIONS RAPIDES
         Rôle :
         - Préparer stories / calls plus tard
         - Pour l’instant accès amis clair
    ============================================================ -->
    <section class="px-4 pt-4 bg-gray-100">
      <button id="friendsCardBtn"
        class="w-full p-4 rounded-3xl bg-white border border-gray-100 shadow-sm flex items-center justify-between gap-3 active:scale-[0.99] transition">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
            <i class="bi bi-people-fill text-xl"></i>
          </div>
          <div class="min-w-0 text-left">
            <div class="font-semibold text-sm truncate">Mes amis</div>
            <div class="text-xs text-gray-500 truncate">Demandes, recherche et liste d’amis</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span id="friendRequestsBadgeCard"
            class="hidden min-w-[22px] h-[22px] px-2 rounded-full bg-red-500 text-white text-[11px] font-bold flex items-center justify-center">
            0
          </span>
          <i class="bi bi-chevron-right text-gray-400"></i>
        </div>
      </button>
    </section>

    <!-- ============================================================
         ZONE CONVERSATIONS
         Rôle :
         - Realtime chats
         - Typing
         - Online
         - Unread
    ============================================================ -->
    <main class="flex-1 overflow-y-auto bg-gray-100 px-4 py-4">
      <div id="chatList" class="space-y-2"></div>

      <div id="chatEmptyState" class="hidden text-center text-sm text-gray-500 py-8">
        Aucune conversation pour l’instant.
      </div>
    </main>

    <footer class="py-5 text-center text-xs text-gray-400 bg-white border-t border-gray-100">
      MyUm • Messenger
    </footer>
  </div>

  <script type="module" src="../mains.js/app-init.js"></script>
  <script type="module" src="./js/chat-home.js"></script>
</body>
</html>
