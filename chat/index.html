<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1A3668', medium:'#2596D9', lightblue:'#3FA9F5', danger:'#DC2626' },
        fontFamily: { display:['Inter','sans-serif'] }
      } }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">
  <!-- ===============================
       APP SHELL (mobile container)
  ================================= -->
  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col">

    <!-- ===============================
         HEADER
    ================================= -->
    <header class="sticky top-0 bg-white border-b border-gray-100 z-10">
      <div class="px-4 py-3 flex items-center justify-between">
        <button class="text-sm font-semibold text-primary" onclick="window.location.href='../public/dashboard.html'">
          ← Dashboard
        </button>
        <div class="font-semibold">Messagerie</div>
        <button class="text-sm font-semibold text-primary" onclick="window.location.href='list.html'">
          Conversations
        </button>
      </div>
    </header>

    <!-- ===============================
         CONTENT
    ================================= -->
    <main class="flex-1 p-4 space-y-4">
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center">
            <i class="bi bi-person-plus text-primary text-xl"></i>
          </div>
          <div class="min-w-0">
            <div class="font-semibold">Rechercher & ajouter des amis</div>
            <div class="text-sm text-gray-500">Trouve un membre par nom, username ou téléphone</div>
          </div>
        </div>

        <button onclick="window.location.href='index.html#friends'"
          class="mt-4 w-full py-3 rounded-2xl bg-gradient-to-r from-medium to-lightblue text-white font-semibold active:scale-95 transition">
          Ouvrir la recherche
        </button>
      </div>

      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-medium/10 flex items-center justify-center">
            <i class="bi bi-chat-dots text-medium text-xl"></i>
          </div>
          <div class="min-w-0">
            <div class="font-semibold">Mes conversations</div>
            <div class="text-sm text-gray-500">Voir les discussions et les non-lus</div>
          </div>
        </div>

        <button onclick="window.location.href='list.html'"
          class="mt-4 w-full py-3 rounded-2xl bg-primary text-white font-semibold active:scale-95 transition">
          Ouvrir
        </button>
      </div>

      <!-- ===============================
           FRIENDS ZONE (search + requests + friends)
      ================================= -->
      <section id="friends" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-5 space-y-4">
        <div class="font-semibold">Amis</div>

        <div class="flex gap-2">
          <input id="searchInput" class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue"
                 placeholder="Nom, username ou téléphone…" />
          <button id="searchBtn"
                  class="px-4 py-3 rounded-2xl bg-primary text-white font-semibold active:scale-95 transition">
            <i class="bi bi-search"></i>
          </button>
        </div>

        <div id="searchResults" class="space-y-2"></div>

        <div class="pt-2">
          <div class="text-sm font-semibold text-gray-700 mb-2">Demandes reçues</div>
          <div id="incomingList" class="space-y-2 text-sm"></div>
        </div>

        <div class="pt-2">
          <div class="text-sm font-semibold text-gray-700 mb-2">Mes amis</div>
          <div id="friendsList" class="space-y-2 text-sm"></div>
        </div>
      </section>
    </main>

    <footer class="py-6 text-center text-xs text-gray-400">
      MyUm • Messagerie
    </footer>
  </div>

  <!-- ✅ Global init (presence + notifications) -->
  <script type="module" src="../mains.js/app-init.js"></script>

  <!-- ✅ Friends logic -->
  <script type="module" src="./js/friends.js"></script>
</body>
</html>
