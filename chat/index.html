<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie | MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: { display: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">

  <!-- TOP BAR -->
  <div class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="goTo('public/dashboard.html')"
        class="flex items-center gap-2 text-sm font-semibold text-primary active:scale-95 transition">
        <i class="bi bi-arrow-left"></i>
        Dashboard
      </button>

      <div class="text-sm font-bold text-gray-700">Messagerie</div>

      <button id="refreshBtn"
        class="w-10 h-10 rounded-xl bg-gray-100 text-gray-700 flex items-center justify-center active:scale-95 transition"
        title="Rafraîchir">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <main class="max-w-md mx-auto px-4 py-5 space-y-5 pb-10">

    <!-- SEARCH -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <h2 class="font-semibold text-base text-primary">Trouver un membre</h2>
      <p class="text-sm text-gray-500 mt-1">
        Recherche instantanée (username, prénom, nom, téléphone).
      </p>

      <div class="mt-4 flex gap-2">
        <input id="searchInput"
          class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 text-sm
                 focus:outline-none focus:ring-2 focus:ring-lightblue/30"
          placeholder="Tape 2 lettres… Ex: HE, EN, SH, +243…" />

        <button id="searchBtn"
          class="px-4 py-3 rounded-2xl bg-primary text-white text-sm font-semibold shadow
                 active:scale-95 transition">
          Rechercher
        </button>
      </div>

      <div id="searchHint" class="mt-3 text-xs text-gray-500"></div>
      <div id="searchResults" class="mt-4 space-y-3"></div>
    </section>

    <!-- INCOMING -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <div class="flex items-center gap-2">
        <i class="bi bi-person-plus text-primary"></i>
        <h2 class="font-semibold text-base text-primary">Demandes reçues</h2>
      </div>
      <div id="incomingList" class="mt-4 space-y-3"></div>
    </section>

    <!-- FRIENDS -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <div class="flex items-center gap-2">
        <i class="bi bi-people text-primary"></i>
        <h2 class="font-semibold text-base text-primary">Mes amis</h2>
      </div>
      <div id="friendsList" class="mt-4 space-y-3"></div>
    </section>

  </main>

  <script>
    // GitHub Pages base path helper (durable)
    function getBasePath() {
      const { pathname } = window.location;
      const parts = pathname.split("/").filter(Boolean);
      if (window.location.hostname.includes("github.io") && parts.length > 0) {
        return "/" + parts[0] + "/";
      }
      return "/";
    }
    function goTo(path) {
      window.location.href = getBasePath() + path;
    }
  </script>

  <script type="module" src="../mains.js/auth-guard.js"></script>
  <script type="module" src="js/friends.js"></script>

</body>
</html>
