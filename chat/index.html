<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - Amis | MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: {
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800 pb-24">

  <!-- (Optionnel) Containers pour partials -->
  <div id="header-container"></div>
  <div id="sidebar-container"></div>

  <!-- ✅ TOP BAR (retour dashboard) -->
  <div class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="goTo('public/dashboard.html')"
        class="flex items-center gap-2 text-sm font-semibold text-primary active:scale-95 transition">
        <i class="bi bi-arrow-left"></i>
        Dashboard
      </button>

      <div class="text-sm font-bold text-gray-700">Messagerie</div>

      <div class="w-20"></div>
    </div>
  </div>

  <!-- ✅ PAGE CONTENT -->
  <main class="max-w-md mx-auto px-4 py-5 space-y-5">

    <!-- 🔎 Search -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <h2 class="font-semibold text-base text-primary">Amis</h2>
      <p class="text-sm text-gray-500 mt-1">
        Recherche par <b>username</b> ou <b>téléphone</b>
      </p>

      <div class="mt-4 flex gap-2">
        <input id="searchInput"
          class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 text-sm
                 focus:outline-none focus:ring-2 focus:ring-lightblue/30"
          placeholder="Ex: HESH0901-VN ou +243..." />

        <button id="searchBtn"
          class="px-4 py-3 rounded-2xl bg-primary text-white text-sm font-semibold shadow
                 active:scale-95 transition">
          Rechercher
        </button>
      </div>

      <div id="searchResults" class="mt-4 space-y-3"></div>
    </section>

    <!-- 📩 Demandes reçues -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <div class="flex items-center gap-2">
        <i class="bi bi-person-plus text-primary"></i>
        <h2 class="font-semibold text-base text-primary">Demandes reçues</h2>
      </div>
      <div id="incomingList" class="mt-4 space-y-3"></div>
    </section>

    <!-- 👥 Mes amis -->
    <section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">
      <div class="flex items-center gap-2">
        <i class="bi bi-people text-primary"></i>
        <h2 class="font-semibold text-base text-primary">Mes amis</h2>
      </div>
      <div id="friendsList" class="mt-4 space-y-3"></div>
    </section>

  </main>

  <!-- NAVBAR (bottom) -->
  <div id="navbar-container"></div>

  <!-- ✅ Guard session (si tu l'utilises déjà dans le projet) -->
  <script type="module" src="../mains.js/auth-guard.js"></script>

  <!-- ✅ Friends logic -->
  <script type="module" src="js/friends.js"></script>

  <!-- ✅ Injection nav (si tu utilises partials/nav.html) -->
  <script type="module">
    // Helpers GitHub Pages (base path)
    window.getBasePath = function () {
      const { pathname } = window.location;
      const parts = pathname.split("/").filter(Boolean);
      if (window.location.hostname.includes("github.io") && parts.length > 0) {
        return "/" + parts[0] + "/";
      }
      return "/";
    };

    window.goTo = function (path) {
      const base = window.getBasePath();
      window.location.href = base + path;
    };

    async function injectNav() {
      try {
        const nav = await fetch("../partials/nav.html");
        document.getElementById("navbar-container").innerHTML = await nav.text();

        // Si tu utilises la version durable data-route + initNav:
        // import { initNav } from "../partials/js/nav.js";
        // initNav();

      } catch (e) {
        console.warn("Nav non chargée:", e);
      }
    }

    injectNav();
  </script>

</body>
</html>
