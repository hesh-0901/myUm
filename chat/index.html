<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat - Amis | MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-gray-100 text-gray-800">

  <div id="header-container"></div>
  <div id="nav-container"></div>
  <div id="sidebar-container"></div>

  <main class="max-w-xl mx-auto p-4 space-y-6 pb-24">

    <!-- SEARCH -->
    <section class="bg-white rounded-3xl shadow-sm p-5 space-y-4">

      <div>
        <h1 class="text-2xl font-bold text-[#1A3668]">Amis</h1>
        <p class="text-sm text-gray-500">
          Recherche par <span class="font-medium">username</span> ou téléphone
        </p>
      </div>

      <div class="flex gap-2">
        <div class="flex-1 relative">
          <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input id="searchInput"
            class="w-full pl-9 pr-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#3FA9F5]"
            placeholder="Ex: ABBA1205-PC ou +243..." />
        </div>

        <button id="searchBtn"
          class="px-4 py-2 rounded-xl bg-[#1A3668] text-white text-sm font-semibold shadow-sm active:scale-95 transition">
          Rechercher
        </button>
      </div>

      <div id="searchResults" class="space-y-3"></div>

    </section>

    <!-- INCOMING -->
    <section class="bg-white rounded-3xl shadow-sm p-5">
      <h2 class="text-lg font-semibold text-[#1A3668]">
        <i class="bi bi-person-plus mr-1"></i> Demandes reçues
      </h2>

      <div id="incomingList" class="mt-4 space-y-3"></div>
    </section>

    <!-- FRIENDS -->
    <section class="bg-white rounded-3xl shadow-sm p-5">
      <h2 class="text-lg font-semibold text-[#1A3668]">
        <i class="bi bi-people mr-1"></i> Mes amis
      </h2>

      <div id="friendsList" class="mt-4 space-y-3"></div>
    </section>

  </main>

  <script type="module" src="../mains.js/auth-guard.js"></script>
  <script type="module" src="js/friends.js"></script>

</body>
</html>
