<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <!-- MOBILE NO ZOOM -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>MyUm Chat</title>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ICONS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- STYLE -->
  <style>
    .glow {
      box-shadow: 0 0 40px rgba(63,169,245,0.4),
                  0 0 80px rgba(63,169,245,0.2);
    }
  </style>
</head>

<body id="body" class="bg-black text-white opacity-0 transition duration-300">

  <!-- 🔴 MAINTENANCE -->
  <div id="maintenanceScreen"
       class="flex items-center justify-center h-screen text-center px-6">

    <div>
      <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center glow animate-pulse">
        <i class="bi bi-tools text-3xl"></i>
      </div>

      <h1 class="text-xl font-bold mb-3">
        Votre nouvelle fonctionnalité de messagerie entre choristes arrive bientôt...
      </h1>

      <p id="maintenanceText" class="text-red-400 text-sm mb-4">
        Chargement...
      </p>

      <div id="eta" class="text-xs text-lightblue hidden">
        ⏳ Retour estimé : <span id="etaValue"></span> min
      </div>
    </div>

  </div>

  <!-- 🟢 APP (ADMIN) -->
  <div id="appContent" class="hidden bg-white text-black min-h-screen">

    <div class="p-6 text-center">
      <h1 class="text-lg font-bold mb-2">Chat MyUm</h1>
      <p class="text-sm text-gray-500">Mode admin actif</p>
    </div>

    <!-- 👉 ici tu vas mettre ton vrai chat plus tard -->

  </div>

  <!-- 🔥 SCRIPT -->
  <script type="module">
    import { db } from "../mains.js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const textEl = document.getElementById("maintenanceText");
    const etaEl = document.getElementById("eta");
    const etaValue = document.getElementById("etaValue");

    const maintenanceEl = document.getElementById("maintenanceScreen");
    const appEl = document.getElementById("appContent");
    const body = document.getElementById("body");

    async function init() {
      try {
        const user = JSON.parse(localStorage.getItem("myum_user"));
        const myId = user?.id;

        const ADMIN_ID = "DZapCVzzXOmcazOyuod9";

        // 🔒 pas connecté = maintenance
        if (!myId) {
          showMaintenance();
          return;
        }

        const snap = await getDoc(doc(db, "config", "app"));

        if (!snap.exists()) {
          showApp();
          return;
        }

        const data = snap.data();

        // 🔥 TEXTE HTML (avec retour ligne)
        textEl.innerHTML = data.maintenanceMessage 
          || "Votre nouvelle fonctionnalité de messagerie<br>entre choristes arrive bientôt...";

        if (data.maintenanceETA) {
          etaEl.classList.remove("hidden");
          etaValue.textContent = data.maintenanceETA;
        }

        const isMaintenance = data.chatMaintenance === true;

        // 👑 ADMIN
        if (myId === ADMIN_ID) {
          showApp();
          return;
        }

        // 👥 USERS
        if (isMaintenance) {
          showMaintenance();
        } else {
          showApp();
        }

      } catch (e) {
        console.error("INIT ERROR:", e);
        showMaintenance();
      }
    }

    function showApp() {
      maintenanceEl.classList.add("hidden");
      appEl.classList.remove("hidden");
      body.classList.remove("opacity-0");
    }

    function showMaintenance() {
      maintenanceEl.classList.remove("hidden");
      appEl.classList.add("hidden");
      body.classList.remove("opacity-0");
    }

    init();

    // 🔥 DEV MODE → SUPPRIME CACHE SERVICE WORKER
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>

</body>
</html>
