<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Messagerie | MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
theme:{
extend:{
colors:{
primary:'#1A3668',
medium:'#2596D9',
lightblue:'#3FA9F5',
danger:'#DC2626'
},
fontFamily:{display:['Inter','sans-serif']}
}
}
}
</script>
</head>

<body class="bg-gray-100 font-display text-gray-800">

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">

<div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">

<button onclick="goTo('public/dashboard.html')"
class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
<i class="bi bi-arrow-left"></i>
</button>

<div class="font-semibold text-sm text-gray-700">
Messagerie
</div>

<button onclick="window.location.href='list.html'"
class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shadow active:scale-95 transition"
title="Mes conversations">
<i class="bi bi-chat-dots"></i>
</button>

</div>


<!-- TABS -->
<div class="max-w-md mx-auto px-4 pb-3">

<div class="flex gap-2 bg-gray-100 p-1 rounded-xl text-xs font-semibold">

<button id="tabIncoming"
class="flex-1 py-2 rounded-lg bg-white shadow text-primary">
Demandes reçues
</button>

<button id="tabOutgoing"
class="flex-1 py-2 rounded-lg text-gray-600">
Demandes envoyées
</button>

<button id="tabFriends"
class="flex-1 py-2 rounded-lg text-gray-600 flex items-center justify-center gap-1">
<i class="bi bi-people"></i>
</button>

</div>

</div>

</header>



<main class="max-w-md mx-auto px-4 py-5 space-y-5 pb-10">

<!-- SEARCH -->
<section class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">

<h2 class="font-semibold text-base text-primary">
Trouver un membre
</h2>

<p class="text-sm text-gray-500 mt-1">
Recherche instantanée (username, prénom, nom, téléphone)
</p>

<div class="mt-4 flex gap-2">

<input id="searchInput"
class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 text-sm
focus:outline-none focus:ring-2 focus:ring-lightblue/30"
placeholder="Tape 2 lettres…"/>

<button id="searchBtn"
class="px-4 py-3 rounded-2xl bg-primary text-white text-sm font-semibold shadow
active:scale-95 transition">

<i class="bi bi-search"></i>

</button>

</div>

<div id="searchHint" class="mt-3 text-xs text-gray-500"></div>

<div id="searchResults" class="mt-4 space-y-3"></div>

</section>



<!-- DEMANDES RECUES -->
<section id="incomingSection"
class="bg-white rounded-3xl shadow-md p-5 border border-gray-100">

<div class="flex items-center gap-2">

<i class="bi bi-person-plus text-primary"></i>

<h2 class="font-semibold text-base text-primary">
Demandes reçues
</h2>

</div>

<div id="incomingList" class="mt-4 space-y-3"></div>

</section>



<!-- DEMANDES ENVOYEES -->
<section id="outgoingSection"
class="bg-white rounded-3xl shadow-md p-5 border border-gray-100 hidden">

<div class="flex items-center gap-2">

<i class="bi bi-send text-primary"></i>

<h2 class="font-semibold text-base text-primary">
Demandes envoyées
</h2>

</div>

<div id="outgoingList" class="mt-4 space-y-3"></div>

</section>



<!-- FRIENDS -->
<section id="friendsSection"
class="bg-white rounded-3xl shadow-md p-5 border border-gray-100 hidden">

<div class="flex items-center gap-2">

<i class="bi bi-people text-primary"></i>

<h2 class="font-semibold text-base text-primary">
Mes amis
</h2>

</div>

<div id="friendsList" class="mt-4 space-y-3"></div>

</section>

</main>



<script>

function getBasePath(){
const {pathname}=window.location;
const parts=pathname.split("/").filter(Boolean);

if(window.location.hostname.includes("github.io")&&parts.length>0){
return"/"+parts[0]+"/";
}

return"/";
}

function goTo(path){
window.location.href=getBasePath()+path;
}


/* TABS SWITCH */

const tabIncoming=document.getElementById("tabIncoming");
const tabOutgoing=document.getElementById("tabOutgoing");
const tabFriends=document.getElementById("tabFriends");

const incomingSection=document.getElementById("incomingSection");
const outgoingSection=document.getElementById("outgoingSection");
const friendsSection=document.getElementById("friendsSection");


function activateTab(tab){

tabIncoming.classList.remove("bg-white","shadow","text-primary");
tabOutgoing.classList.remove("bg-white","shadow","text-primary");
tabFriends.classList.remove("bg-white","shadow","text-primary");

incomingSection.classList.add("hidden");
outgoingSection.classList.add("hidden");
friendsSection.classList.add("hidden");

if(tab==="incoming"){
tabIncoming.classList.add("bg-white","shadow","text-primary");
incomingSection.classList.remove("hidden");
}

if(tab==="outgoing"){
tabOutgoing.classList.add("bg-white","shadow","text-primary");
outgoingSection.classList.remove("hidden");
}

if(tab==="friends"){
tabFriends.classList.add("bg-white","shadow","text-primary");
friendsSection.classList.remove("hidden");
}

}

tabIncoming.onclick=()=>activateTab("incoming");
tabOutgoing.onclick=()=>activateTab("outgoing");
tabFriends.onclick=()=>activateTab("friends");

</script>


<script type="module" src="../mains.js/auth-guard.js"></script>
<script type="module" src="js/friends.js"></script>

</body>
</html>
