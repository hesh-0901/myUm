<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: {
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800 flex justify-center overflow-x-hidden">
  <!-- ============================================================
       APP SHELL
       Rôle :
       - Conteneur mobile-first stable
       - Une seule vraie page de messagerie
  ============================================================ -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

    <!-- ============================================================
         HEADER MESSENGER
         Rôle :
         - Retour dashboard
         - Titre principal
         - Bouton refresh
    ============================================================ -->
    <header class="sticky top-0 z-20 bg-white border-b border-gray-100">
      <div class="px-4 py-3 flex items-center justify-between gap-3">
        <button id="backDashboardBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="min-w-0 flex-1">
          <div class="font-semibold text-sm truncate">Messagerie</div>
          <div class="text-xs text-gray-400 truncate">Conversations, demandes et amis</div>
        </div>

        <button id="refreshBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>

      <!-- ============================================================
           RECHERCHE GLOBALE
           Rôle :
           - Recherche amis / utilisateurs
           - Recherche temps réel
      ============================================================ -->
      <div class="px-4 pb-3">
        <div class="flex gap-2">
          <input id="searchInput"
            class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue text-sm"
            placeholder="Rechercher un nom, username ou téléphone..." />
          <button id="searchBtn"
            class="px-4 py-3 rounded-2xl bg-primary text-white font-semibold active:scale-95 transition">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- ============================================================
         CONTENU PRINCIPAL
         Rôle :
         - Zone scrollable unique
    ============================================================ -->
    <main class="flex-1 overflow-y-auto bg-gray-100 px-4 py-4 space-y-4">

      <!-- ============================================================
           RÉSULTATS DE RECHERCHE
           Rôle :
           - Montrer utilisateurs trouvés
           - Ajouter en ami sans spam
      ============================================================ -->
      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-search text-primary"></i>
          <h2 class="font-semibold text-sm">Résultats de recherche</h2>
        </div>
        <div id="searchResults" class="space-y-2"></div>
      </section>

      <!-- ============================================================
           CONVERSATIONS
           Rôle :
           - Vraie entrée principale style Messenger
           - Realtime, badges non lus, typing, online
      ============================================================ -->
      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-chat-dots text-primary"></i>
          <h2 class="font-semibold text-sm">Conversations</h2>
        </div>
        <div id="chatList" class="space-y-2"></div>
        <div id="chatEmptyState" class="hidden text-xs text-gray-500 text-center py-4">
          Aucune conversation.
        </div>
      </section>

      <!-- ============================================================
           DEMANDES REÇUES
           Rôle :
           - Voir qui veut devenir ami
      ============================================================ -->
      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-person-plus text-primary"></i>
          <h2 class="font-semibold text-sm">Demandes reçues</h2>
        </div>
        <div id="incomingList" class="space-y-2"></div>
      </section>

      <!-- ============================================================
           AMIS
           Rôle :
           - Liste rapide des amis
           - Accès direct à la room
      ============================================================ -->
      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-people text-primary"></i>
          <h2 class="font-semibold text-sm">Mes amis</h2>
        </div>
        <div id="friendsList" class="space-y-2"></div>
      </section>

    </main>

    <footer class="py-5 text-center text-xs text-gray-400 bg-white border-t border-gray-100">
      MyUm • Messenger
    </footer>
  </div>

  <!-- ============================================================
       APP INIT GLOBAL
       Rôle :
       - auth
       - presence
       - notifications
  ============================================================ -->
  <script type="module" src="../mains.js/app-init.js"></script>

  <!-- ============================================================
       CHAT HOME LOGIC
       Rôle :
       - Fusion conversations + recherche + demandes + amis
  ============================================================ -->
  <script type="module" src="./js/chat-home.js"></script>
</body>
</html>
