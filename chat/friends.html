<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes amis - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: {
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800 flex justify-center overflow-x-hidden">
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

    <!-- ============================================================
         HEADER AMIS
    ============================================================ -->
    <header class="sticky top-0 z-20 bg-white border-b border-gray-100">
      <div class="px-4 py-3 flex items-center justify-between gap-3">
        <button id="backChatBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="min-w-0 flex-1">
          <div class="font-semibold text-sm truncate">Mes amis</div>
          <div class="text-xs text-gray-400 truncate">Recherche, demandes et liste d’amis</div>
        </div>

        <div class="w-10 h-10"></div>
      </div>

      <!-- Recherche -->
      <div class="px-4 pb-3">
        <div class="relative">
          <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input id="searchInput"
            class="w-full pl-10 pr-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue text-sm bg-gray-50"
            placeholder="Rechercher une personne..." />
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-gray-100 px-4 py-4 space-y-4">
      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-search text-primary"></i>
          <h2 class="font-semibold text-sm">Résultats</h2>
        </div>
        <div id="searchResults" class="space-y-2"></div>
      </section>

      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-person-plus text-primary"></i>
          <h2 class="font-semibold text-sm">Demandes reçues</h2>
        </div>
        <div id="incomingList" class="space-y-2"></div>
      </section>

      <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-2 mb-3">
          <i class="bi bi-people text-primary"></i>
          <h2 class="font-semibold text-sm">Liste d’amis</h2>
        </div>
        <div id="friendsList" class="space-y-2"></div>
      </section>
    </main>

    <footer class="py-5 text-center text-xs text-gray-400 bg-white border-t border-gray-100">
      MyUm • Social
    </footer>
  </div>

  <script type="module" src="../mains.js/app-init.js"></script>
  <script type="module" src="./js/friends-page.js"></script>
</body>
</html>
