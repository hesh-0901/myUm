<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion | MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: { display: ['Inter','sans-serif'] }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">

  <!-- TOP BAR -->
  <div class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <button id="backBtn"
        class="w-10 h-10 rounded-xl bg-gray-100 text-gray-700 flex items-center justify-center active:scale-95 transition">
        <i class="bi bi-arrow-left"></i>
      </button>

      <div class="min-w-0 flex-1">
        <div id="roomTitle" class="font-bold text-sm text-gray-800 truncate">Discussion</div>
        <div id="roomSub" class="text-xs text-gray-500 truncate">—</div>
      </div>

      <button id="dashBtn"
        class="w-10 h-10 rounded-xl bg-gray-100 text-gray-700 flex items-center justify-center active:scale-95 transition"
        title="Dashboard">
        <i class="bi bi-house-door"></i>
      </button>
    </div>
  </div>

  <!-- MESSAGES -->
  <main class="max-w-md mx-auto px-4 pt-4 pb-28">
    <div id="messages" class="space-y-2"></div>

    <div id="emptyState" class="mt-10 text-center text-sm text-gray-500 hidden">
      Aucun message. Dis bonjour 👋
    </div>
  </main>

  <!-- INPUT BAR -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200">
    <div class="max-w-md mx-auto p-3 flex items-center gap-2">
      <input id="messageInput"
        class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 bg-gray-50 text-sm
               focus:outline-none focus:ring-2 focus:ring-lightblue/30"
        placeholder="Écris un message…" />

      <button id="sendBtn"
        class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center shadow
               active:scale-95 transition">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>

  <!-- GitHub Pages base helper -->
  <script>
    function getBasePath() {
      const { pathname } = window.location;
      const parts = pathname.split("/").filter(Boolean);
      if (window.location.hostname.includes("github.io") && parts.length > 0) {
        return "/" + parts[0] + "/";
      }
      return "/";
    }
    function goTo(path) {
      window.location.href = getBasePath() + path;
    }
  </script>

  <script type="module" src="../mains.js/auth-guard.js"></script>
  <script type="module" src="js/chat-room.js"></script>
</body>
</html>
