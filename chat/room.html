<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary:'#1A3668', medium:'#2596D9', lightblue:'#3FA9F5' },
        fontFamily: { display:['Inter','sans-serif'] }
      } }
    }
  </script>
</head>

<body class="bg-gray-100 font-display text-gray-800">
  <div class="w-full max-w-md mx-auto min-h-screen flex flex-col">

    <!-- ===============================
         ROOM HEADER (STABLE)
    ================================= -->
    <header class="sticky top-0 bg-white border-b border-gray-100 z-10">
      <div class="px-4 py-3 flex items-center justify-between">

        <button id="backBtn" class="text-sm font-semibold text-primary">
          ← Conversations
        </button>

        <div class="flex items-center gap-3 min-w-0 flex-1 justify-center">
          <div id="roomAvatar"
            class="w-10 h-10 rounded-full overflow-hidden bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-700">
            —
          </div>

          <div class="min-w-0">
            <div id="roomTitle" class="font-semibold text-sm truncate">—</div>
            <div id="roomSub" class="text-xs text-gray-400 truncate">—</div>
            <div id="typingIndicator" class="text-xs text-gray-400 hidden">… écrit</div>
          </div>
        </div>

        <button id="dashBtn" class="text-sm font-semibold text-primary">
          Chat
        </button>

      </div>
    </header>

    <!-- ===============================
         MESSAGES
    ================================= -->
    <main class="flex-1 p-4 space-y-3 overflow-y-auto" id="messages"></main>

    <div id="emptyState" class="hidden text-center text-sm text-gray-500 px-4 pb-4">
      Aucun message.
    </div>

    <!-- ===============================
         INPUT BAR
    ================================= -->
    <footer class="sticky bottom-0 bg-white border-t border-gray-100">
      <div class="px-3 py-3 flex items-center gap-2">
        <input id="messageInput"
               class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue"
               placeholder="Écrire un message…" />
        <button id="sendBtn"
                class="px-4 py-3 rounded-2xl bg-primary text-white font-semibold active:scale-95 transition">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </footer>

  </div>

  <script type="module" src="../mains.js/app-init.js"></script>
  <script type="module" src="./js/chat-room.js"></script>
</body>
</html>
