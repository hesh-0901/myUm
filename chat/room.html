<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion - MyUm</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1A3668',
            medium: '#2596D9',
            lightblue: '#3FA9F5',
            danger: '#DC2626'
          },
          fontFamily: {
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>

<!-- ============================================================
     BODY FIXÉ
     Rôle :
     - Empêcher le scroll global de la page
     - Forcer le scroll uniquement dans la zone messages
============================================================ -->
<body class="bg-gray-100 font-display text-gray-800 h-screen overflow-hidden flex justify-center">

  <!-- ============================================================
       APP SHELL
       Rôle :
       - Conteneur principal mobile-first
       - Toute la hauteur de l’écran
       - Aucun scroll global ici
  ============================================================ -->
  <div class="w-full max-w-[420px] h-screen bg-white flex flex-col overflow-hidden">

    <!-- ============================================================
         HEADER ROOM
         Rôle :
         - Toujours visible en haut
    ============================================================ -->
    <header class="shrink-0 bg-white border-b border-gray-100 z-20">
      <div class="px-4 py-3 flex items-center justify-between gap-3">

        <button id="backBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-arrow-left"></i>
        </button>

        <div class="flex items-center gap-3 min-w-0 flex-1">
          <div id="roomAvatar"
            class="w-10 h-10 rounded-full overflow-hidden bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-700 shrink-0">
            —
          </div>

          <div class="min-w-0">
            <div id="roomTitle" class="font-semibold text-sm truncate">—</div>
            <div id="roomSub" class="text-xs text-gray-400 truncate">—</div>
            <div id="typingIndicator" class="text-xs text-lightblue hidden truncate">
              … écrit
            </div>
          </div>
        </div>

        <button id="chatHomeBtn"
          class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center text-gray-700 active:scale-95 transition">
          <i class="bi bi-chat-dots"></i>
        </button>
      </div>
    </header>

    <!-- ============================================================
         ZONE SCROLLABLE DES MESSAGES
         Rôle :
         - SEULE zone qui scrolle
         - Le footer n’est plus affecté
    ============================================================ -->
    <main id="messagesWrapper"
      class="flex-1 min-h-0 overflow-y-auto bg-gray-100 px-3 py-4">
      <div id="messages" class="space-y-2"></div>

      <div id="emptyState" class="hidden text-center text-sm text-gray-500 pt-10">
        Aucun message pour l’instant.
      </div>
    </main>
    <!-- ============================================================
     BOUTON NOUVEAUX MESSAGES
     Rôle :
     - Permet de revenir en bas sans forcer l'utilisateur
     - Visible seulement si on n'est pas déjà en bas
============================================================ -->
<div id="scrollToBottomBtn"
  class="hidden absolute bottom-24 right-6 z-30">
  <button
    class="w-11 h-11 rounded-full bg-primary text-white shadow-lg flex items-center justify-center active:scale-95 transition">
    <i class="bi bi-arrow-down"></i>
  </button>
</div>
    <!-- ============================================================
         FOOTER FIXE DANS LE SHELL
         Rôle :
         - Toujours visible
         - Ne dépend jamais du scroll des messages
    ============================================================ -->
    <footer class="shrink-0 bg-white border-t border-gray-100">
      <div class="px-3 py-3 flex items-center gap-2">
        <input id="messageInput"
          type="text"
          placeholder="Écrire un message..."
          class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 outline-none focus:border-lightblue text-sm" />

        <button id="sendBtn"
          class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center active:scale-95 transition shadow-sm">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </footer>

  </div>

  <!-- ============================================================
       APP INIT GLOBAL
  ============================================================ -->
  <script type="module" src="../mains.js/app-init.js"></script>

  <!-- ============================================================
       ROOM LOGIC
  ============================================================ -->
  <script type="module" src="./js/chat-room.js"></script>
</body>
</html>
