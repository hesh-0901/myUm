<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Discussion | MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config={
theme:{
extend:{
colors:{
primary:'#1A3668',
medium:'#2596D9',
lightblue:'#3FA9F5',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>

<body class="bg-gray-100 font-display text-gray-800">


<div class="max-w-md mx-auto h-screen flex flex-col bg-gray-100">


<!-- HEADER -->

<header class="bg-white border-b border-gray-200">

<div class="px-4 py-3 flex items-center justify-between">

<button id="backBtn"
class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 transition">

<i class="bi bi-arrow-left text-lg"></i>

</button>


<!-- USER INFO -->

<div class="flex items-center gap-3 flex-1 px-2">

<div
id="roomAvatar"
class="w-10 h-10 rounded-full overflow-hidden bg-gray-200 flex items-center justify-center text-xs font-semibold">

</div>

<div class="text-left min-w-0">

<div id="roomTitle"
class="text-sm font-semibold text-gray-900 truncate">
Discussion
</div>

<div id="roomSub"
class="text-xs text-gray-500 truncate">
—
</div>

</div>

</div>


<button id="dashBtn"
class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 transition">

<i class="bi bi-grid text-lg"></i>

</button>

</div>

</header>



<!-- MESSAGES -->

<main
id="messagesContainer"
class="flex-1 overflow-y-auto px-4 py-4 space-y-3">

<div id="messages" class="space-y-3"></div>

<div
id="emptyState"
class="text-center text-sm text-gray-500 mt-10 hidden">

Aucun message

</div>

</main>



<!-- INPUT -->

<footer class="bg-white border-t border-gray-200">

<div class="px-3 py-3 flex items-center gap-2">

<input
id="messageInput"
type="text"
placeholder="Écrire un message"
class="flex-1 bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-lightblue/30"
/>

<button
id="sendBtn"
class="w-11 h-11 flex items-center justify-center rounded-xl bg-primary text-white shadow-sm hover:bg-primary/90 active:scale-95 transition">

<i class="bi bi-send text-base"></i>

</button>

</div>

</footer>

</div>



<!-- GitHub Pages helper -->

<script>

function getBasePath(){

const { pathname } = window.location
const parts = pathname.split("/").filter(Boolean)

if(window.location.hostname.includes("github.io") && parts.length>0){

return "/" + parts[0] + "/"

}

return "/"

}

function goTo(path){

window.location.href = getBasePath() + path

}

</script>


<script type="module" src="../mains.js/auth-guard.js"></script>
<script type="module">
  import { initPresence } from "../mains.js/presence.js";
  initPresence();
</script>

<script type="module" src="js/chat-room.js"></script>

</body>
</html>
