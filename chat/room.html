<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Chat Room</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

  <!-- APP -->
  <div class="w-full max-w-[420px] h-screen bg-white flex flex-col">

    <!-- HEADER -->
 <div class="p-3 border-b flex items-center gap-3 bg-white">

  <button onclick="history.back()"
    class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100">
    <i class="bi bi-arrow-left"></i>
  </button>

  <div id="roomAvatar"
    class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold">
    U
  </div>

  <div class="flex-1 min-w-0">
    <div id="roomTitle" class="font-semibold text-sm truncate">
      Chargement...
    </div>
    <div id="roomSub" class="text-xs text-gray-400 truncate">
      ...
    </div>
  </div>

</div>

    <!-- MESSAGES -->
    <div id="messages"
         class="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-100">

      <!-- messages apparaissent ici -->

    </div>

    <!-- INPUT -->
    <div class="p-3 border-t bg-white flex items-center gap-2">

      <input
        id="messageInput"
        type="text"
        placeholder="Écrire un message..."
        class="flex-1 px-3 py-2 border rounded-xl text-sm outline-none focus:border-blue-500" />

      <button
        id="sendBtn"
        class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center">

        <i id="sendBtnIcon" class="bi bi-mic-fill"></i>

      </button>

    </div>

  </div>

  <!-- 🔥 IMPORTANT -->
  <script type="module" src="./js/room/room-init.js?v=2"></script>

</body>
</html>
