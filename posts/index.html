<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Posts</title>

  <!-- PWA -->
  <link rel="manifest" href="/myUm/manifest.json">
  <link rel="icon" href="/myUm/assets/favicon.png">
  <meta name="theme-color" content="#1A3668">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/myUm/assets/css/output.css">
</head>

<body class="bg-gray-100 flex justify-center">

  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col">

    <!-- HEADER BACK -->
    <div id="header-container"></div>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto">

      <!-- CREATE POST -->
      <div class="p-4 border-b">

        <div class="flex items-center space-x-3">

          <img id="userPhoto" class="w-10 h-10 rounded-full object-cover" />

          <input
            id="postInput"
            type="text"
            placeholder="Quoi de neuf ?"
            class="flex-1 bg-gray-100 px-3 py-2 rounded-full text-sm outline-none"
          />

        </div>

        <button
          id="sendPostBtn"
          class="w-full mt-3 bg-gradient-to-r from-[#2596D9] to-[#3FA9F5] text-white py-2 rounded-xl text-sm font-semibold active:scale-95 transition">
          Publier
        </button>

      </div>

      <!-- POSTS -->
      <div id="postsList" class="divide-y"></div>

    </main>

  </div>

  <script type="module" src="/myUm/mains.js/app-init.js"></script>
  <script type="module" src="./js/posts.js"></script>

</body>
</html>
