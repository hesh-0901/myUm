<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Posts</title>

  <!-- PWA -->
  <link rel="manifest" href="/myUm/manifest.json">
  <link rel="icon" href="/myUm/assets/favicon.png">
  <meta name="theme-color" content="#1A3668">

  <!-- Tailwind + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

  <!-- APP CONTAINER -->
  <div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

    <!-- HEADER -->
    <div id="header-container"></div>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- CREATE POST -->
      <div class="bg-gray-50 rounded-2xl p-3 flex items-center space-x-3">
        <input 
          id="postInput"
          type="text" 
          placeholder="Exprime-toi..."
          class="flex-1 text-sm bg-transparent outline-none"
        />

        <button id="sendPostBtn" class="text-blue-500 active:scale-95 transition">
          <i class="bi bi-send"></i>
        </button>
      </div>

      <!-- POSTS LIST -->
      <div id="postsList" class="space-y-3"></div>

    </main>

    <!-- NAV -->
    <div id="nav-container"></div>

  </div>

  <!-- GLOBAL INIT (OBLIGATOIRE) -->
  <script type="module" src="/myUm/mains.js/app-init.js"></script>

  <!-- PAGE SCRIPT -->
  <script type="module" src="./js/posts.js"></script>

</body>
</html>
