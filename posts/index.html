<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Posts - MyUm</title>

<link rel="icon" href="/myUm/assets/favicon.png">
<link rel="manifest" href="/myUm/manifest.json">
<meta name="theme-color" content="#1A3668">

<!-- PREFETCH NAVIGATION -->
<link rel="prefetch" href="/myUm/public/dashboard.html">
<link rel="prefetch" href="/myUm/posts/index.html">
<link rel="prefetch" href="/myUm/chat/index.html">
<link rel="prefetch" href="/myUm/users/profile.html">
<link rel="prefetch" href="/myUm/users/presence.html">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

</head>

<body class="bg-gray-100 flex justify-center font-display">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-container"></header>

<main class="flex-1 overflow-y-auto px-4 py-4 space-y-4">

  <!-- CREATE POST -->
  <div id="create-post" class="flex items-start gap-3 pb-4 border-b border-gray-100">

    <img id="userAvatar" class="w-10 h-10 rounded-full object-cover">

    <div class="flex-1">

      <textarea id="postInput"
        placeholder="Exprime-toi..."
        class="w-full text-sm text-gray-800 placeholder-gray-400 resize-none outline-none"></textarea>

      <div class="flex justify-between items-center mt-2">

        <div class="flex gap-4 text-gray-400">

          <button id="addImageBtn" class="active:scale-95">
            <i class="bi bi-image"></i>
          </button>

          <button id="addVideoBtn" class="active:scale-95">
            <i class="bi bi-camera-video"></i>
          </button>

        </div>

        <button id="publishBtn"
          class="text-sm font-semibold text-primary active:scale-95 transition">
          Publier
        </button>

      </div>

    </div>

  </div>

  <!-- POSTS -->
  <div id="posts-list" class="space-y-4"></div>

</main>

<footer id="nav-container"></footer>

</div>

<!-- HEADER -->
<script type="module">
const header = await fetch("/myUm/partials/header-back.html");
document.getElementById("header-container").innerHTML = await header.text();
await import("/myUm/partials/js/back-header.js");
document.querySelector("header").setAttribute("data-title", "Posts");
</script>

<!-- NAV -->
<script type="module">
const nav = await fetch("/myUm/partials/nav.html");
document.getElementById("nav-container").innerHTML = await nav.text();
</script>

<!-- PAGE JS -->
<script type="module" src="/myUm/posts/js/posts.js"></script>

<!-- CORE APP -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>

</body>
</html>
