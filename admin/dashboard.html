<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<title>Dashboard Admin</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header"></header>

<main class="flex-1 overflow-y-auto p-4 space-y-4">

<!-- TOTAL -->
<div class="bg-blue-50 rounded-3xl p-5 shadow-sm">
<h2 class="text-sm text-gray-500">Total choristes</h2>
<p id="totalUsers" class="text-2xl font-semibold text-primary mt-1">0</p>
</div>

<!-- GENRE -->
<div class="grid grid-cols-3 gap-3">

<div class="bg-green-50 p-4 rounded-3xl text-center">
<p class="text-xs text-gray-500">H</p>
<p id="countH" class="text-lg font-semibold text-green-600">0</p>
</div>

<div class="bg-pink-50 p-4 rounded-3xl text-center">
<p class="text-xs text-gray-500">F</p>
<p id="countM" class="text-lg font-semibold text-pink-600">0</p>
</div>

<div class="bg-gray-100 p-4 rounded-3xl text-center">
<p class="text-xs text-gray-500">NM</p>
<p id="countNM" class="text-lg font-semibold text-gray-600">0</p>
</div>

</div>

<!-- PAR CHORALE -->
<div id="choraleContainer" class="space-y-3"></div>

</main>

<footer id="nav"></footer>

</div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/dashboard.js"></script>

</body>
</html>
