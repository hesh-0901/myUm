<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détails utilisateur - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        danger: '#DC2626'
      }
    }
  }
}
</script>
</head>

<body class="bg-gray-100 text-gray-800 pb-20">

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-semibold">Détails utilisateur</h1>
    <button onclick="history.back()"
      class="text-sm text-gray-500 hover:text-primary">
      <i class="bi bi-arrow-left"></i>
    </button>
  </div>

  <!-- CONTAINER -->
  <div id="userContainer"
       class="bg-white rounded-3xl shadow-sm p-6 space-y-6">
  </div>

</div>

<script type="module">

import { db } from "/myUm/mains.js/firebase-config.js";
import {
  doc,
  getDoc,
  updateDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const userId = params.get("uid");

const currentUser = JSON.parse(localStorage.getItem("myum_user"));
const container = document.getElementById("userContainer");

let originalData = {};
let editedData = {};

// =========================
// LOAD USER
// =========================

async function loadUser() {

  const snap = await getDoc(doc(db, "users", userId));
  if (!snap.exists()) return;

  originalData = snap.data();
  editedData = { ...originalData };

  renderFields();
}

loadUser();

// =========================
// RENDER FIELDS
// =========================

function renderFields() {

  container.innerHTML = "";

  Object.keys(originalData).forEach(field => {

    const value = originalData[field] ?? "";

    const div = document.createElement("div");
    div.className =
      "flex items-center justify-between border-b pb-3";

    div.innerHTML = `
      <div class="flex-1">
        <p class="text-xs text-gray-400">${field}</p>
        <p id="field-${field}" class="text-sm mt-1">
          ${value}
        </p>
      </div>

      <button class="edit-btn text-gray-400 hover:text-primary"
        data-field="${field}">
        <i class="bi bi-pencil"></i>
      </button>
    `;

    container.appendChild(div);
  });

  initEditButtons();
}

// =========================
// EDIT LOGIC
// =========================

function initEditButtons() {

  document.querySelectorAll(".edit-btn").forEach(btn => {

    btn.addEventListener("click", () => {

      const field = btn.dataset.field;
      const textEl = document.getElementById(`field-${field}`);

      const input = document.createElement("input");
      input.type = "text";
      input.value = editedData[field] ?? "";
      input.className =
        "w-full mt-1 p-2 text-sm border rounded-lg focus:outline-none focus:border-primary";

      textEl.replaceWith(input);
      input.id = `field-${field}`;

      btn.innerHTML = `<i class="bi bi-check-lg text-primary"></i>`;

      btn.onclick = async () => {

        const newValue = input.value.trim();
        editedData[field] = newValue;

        if (currentUser.role === "super_admin") {

          await updateDoc(doc(db, "users", userId), {
            [field]: newValue
          });

        } else {

          await addDoc(collection(db, "user_edit_requests"), {
            userId,
            requestedBy: currentUser.id,
            changes: { [field]: newValue },
            status: "pending",
            createdAt: serverTimestamp()
          });

        }

        loadUser();
      };

    });

  });

}

</script>

</body>
</html>
