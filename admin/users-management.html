<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:linear-gradient(180deg,#0f2145,#1A3668);
}

.folder{
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
cursor:pointer;
transition:.18s;
}

.folder:hover{
transform:translateY(-2px);
}

.folderIcon{
font-size:48px;
color:#3FA9F5;
}

.folderName{
font-size:13px;
font-weight:500;
text-align:center;
}

.bubble{
position:absolute;
top:-4px;
right:-6px;
background:#ef4444;
color:white;
font-size:10px;
font-weight:600;
padding:2px 7px;
border-radius:30px;
}

.userRow{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
}

.userRow:hover{
background:rgba(255,255,255,.12);
}

.card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:16px;
}

.btn{
padding:10px;
border-radius:10px;
font-weight:600;
}

.btnApprove{
background:#16a34a;
}

.btnReject{
background:#dc2626;
}

</style>

</head>


<body class="flex justify-center font-[Inter] text-white">

<div class="w-full max-w-[420px] min-h-screen flex flex-col">


<header class="flex items-center gap-3 p-5 border-b border-white/10">

<button id="backBtn" class="hidden text-white/70 text-lg">
<i class="bi bi-arrow-left"></i>
</button>

<h1 id="pageTitle" class="text-lg font-semibold">
Gestion des membres
</h1>

</header>


<main id="foldersView" class="flex-1 overflow-y-auto p-6">

<div id="foldersGrid"
class="grid grid-cols-3 gap-10 text-center"></div>

</main>


<section id="usersView"
class="hidden flex-1 overflow-y-auto p-5 space-y-3"></section>


<section id="userDetailView"
class="hidden flex-1 overflow-y-auto p-5 space-y-4"></section>


</div>

<script type="module" src="/myUm/admin/js/users-management.js"></script>

</body>
</html>
