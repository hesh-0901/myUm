<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des utilisateurs - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5',
        danger: '#DC2626'
      }
    }
  }
}
</script>
</head>

<body class="bg-gray-100 text-gray-800 pb-20">

<div class="max-w-6xl mx-auto px-4 py-8">

  <!-- ========================= -->
  <!-- HEADER PREMIUM -->
  <!-- ========================= -->
  <div class="bg-white rounded-3xl shadow-sm p-6 mb-6">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

      <!-- TITRE -->
      <div>
        <h1 class="text-xl font-semibold">Gestion des utilisateurs</h1>
        <p id="usersCount" class="text-xs text-gray-500 mt-1">
          Chargement...
        </p>
      </div>

      <!-- ACTIONS -->
      <div class="flex items-center gap-3">

        <!-- RECHERCHE -->
        <div class="relative">
          <input type="text"
                 id="searchInput"
                 placeholder="Rechercher..."
                 class="pl-9 pr-4 py-2 text-sm rounded-xl border border-gray-200 focus:outline-none focus:border-primary">
          <i class="bi bi-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
        </div>

        <!-- FILTRE CHORALE -->
        <select id="choraleFilter"
                class="text-sm px-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">
          <option value="all">Toutes</option>
        </select>

        <!-- EXPORT XLS -->
        <button id="exportBtn"
          class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shadow-md hover:scale-105 active:scale-95 transition">
          <i class="bi bi-file-earmark-spreadsheet"></i>
        </button>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- LISTE UTILISATEURS -->
  <!-- ========================= -->

  <div id="usersList" class="space-y-3">
    <!-- Généré dynamiquement -->
  </div>

</div>


<script type="module">

import { db } from "/myUm/mains.js/firebase-config.js";
import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const usersList = document.getElementById("usersList");
const usersCount = document.getElementById("usersCount");
const searchInput = document.getElementById("searchInput");
const choraleFilter = document.getElementById("choraleFilter");
const exportBtn = document.getElementById("exportBtn");

let allUsers = [];

// =========================
// LOAD USERS
// =========================

async function loadUsers() {

  const snapshot = await getDocs(collection(db, "users"));

  allUsers = [];

  snapshot.forEach(doc => {
    allUsers.push({ id: doc.id, ...doc.data() });
  });

  usersCount.innerText = `${allUsers.length} membres`;

  populateChoraleFilter();
  renderUsers(allUsers);
}

loadUsers();

// =========================
// RENDER USERS
// =========================

function renderUsers(users) {

  usersList.innerHTML = "";

  users.forEach((user, index) => {

    const div = document.createElement("div");
    div.className =
      "bg-white rounded-2xl shadow-sm p-4 flex items-center justify-between hover:shadow-md transition";

    div.innerHTML = `
      <div class="flex items-center gap-4">

        <span class="text-sm text-gray-400 w-6">
          ${index + 1}.
        </span>

        <div>
          <p class="text-sm font-semibold">
            ${user.username}
          </p>
          <p class="text-xs text-gray-500">
            ${user.firstName} ${user.lastName}
          </p>
        </div>

        <span class="px-2 py-1 text-xs rounded-full bg-primary/10 text-primary">
          ${user.role}
        </span>

      </div>

      <div class="flex items-center gap-3">

        <!-- ACTIVER / DESACTIVER -->
        <button onclick="toggleActive('${user.id}')"
          class="text-gray-500 hover:text-primary">
          <i class="bi bi-power"></i>
        </button>

        <!-- CHANGER ROLE -->
        <button onclick="changeRole('${user.id}')"
          class="text-gray-500 hover:text-primary">
          <i class="bi bi-person-gear"></i>
        </button>

        <!-- VOIR PLUS -->
        <button onclick="viewDetails('${user.id}')"
          class="text-gray-500 hover:text-primary">
          <i class="bi bi-eye"></i>
        </button>

      </div>
    `;

    usersList.appendChild(div);
  });
}

// =========================
// SEARCH
// =========================

searchInput.addEventListener("input", () => {

  const value = searchInput.value.toLowerCase();

  const filtered = allUsers.filter(user =>
    user.username.toLowerCase().includes(value) ||
    (user.firstName + " " + user.lastName).toLowerCase().includes(value)
  );

  renderUsers(filtered);
});

// =========================
// FILTER CHORALE
// =========================

function populateChoraleFilter() {

  const chorales = [...new Set(allUsers.map(u => u.chorale))];

  chorales.forEach(c => {
    const option = document.createElement("option");
    option.value = c;
    option.innerText = c;
    choraleFilter.appendChild(option);
  });
}

choraleFilter.addEventListener("change", () => {

  if (choraleFilter.value === "all") {
    renderUsers(allUsers);
  } else {
    const filtered = allUsers.filter(u => u.chorale === choraleFilter.value);
    renderUsers(filtered);
  }
});

// =========================
// REDIRECTION
// =========================

window.viewDetails = function(id) {
  window.location.href = `/myUm/admin/user-details.html?uid=${id}`;
};

// =========================
// EXPORT XLS
// =========================

exportBtn.addEventListener("click", () => {

  const headers = Object.keys(allUsers[0]);
  const rows = allUsers.map(u =>
    headers.map(h => `"${u[h] ?? ""}"`).join(",")
  );

  const csvContent =
    headers.join(",") + "\n" + rows.join("\n");

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "users_export.csv";
  link.click();
});

</script>

</body>
</html>
