<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 flex justify-center overflow-x-hidden font-[Inter]">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-back"></header>

<!-- TABS -->

<div class="flex m-4 bg-gray-100 border rounded-xl overflow-hidden">

<button id="tabActive"
class="flex-1 py-2 text-sm font-medium text-center bg-[#2596D9] text-white">

Actifs

</button>

<button id="tabPending"
class="flex-1 py-2 text-sm font-medium text-center">

En attente

</button>

<button id="tabRejected"
class="flex-1 py-2 text-sm font-medium text-center">

Refusés

</button>

</div>


<main
id="usersList"
class="flex-1 overflow-y-auto p-5 space-y-3">

<div class="text-xs uppercase tracking-wide opacity-60 mb-2">

Liste des utilisateurs

</div>

<div id="usersContainer" class="space-y-3">

</div>

</main>

</div>


<!-- MODAL -->

<div
id="userDetailModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-5">

<div class="w-full max-w-md space-y-3">

<div class="flex items-center justify-between">

<div class="text-xs uppercase tracking-wide opacity-70">

Dossier utilisateur

</div>

<button id="closeUserModal" class="text-gray-500 text-lg">

<i class="bi bi-x-lg"></i>

</button>

</div>

<div
id="userDetailCard"
class="rounded-3xl shadow-sm p-5 bg-white space-y-4">

</div>

</div>

</div>


<script type="module"
src="/myUm/partials/js/back-header.js"></script>

<script type="module"
src="/myUm/admin/js/users-management.js"></script>

<script type="module"
src="/myUm/mains.js/app-init.js"></script>

</body>
</html>
