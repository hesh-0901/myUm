<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* =========================
   BACKGROUND
========================= */

body{
background:linear-gradient(180deg,#0f2145,#1A3668);
}


/* =========================
   SEGMENTED TABS
========================= */

.tabsContainer{

display:flex;

margin:16px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

border-radius:12px;

overflow:hidden;

}


.tabItem{

flex:1;

padding:10px;

font-size:13px;

font-weight:500;

text-align:center;

cursor:pointer;

transition:.2s;

color:white;

border-right:1px solid rgba(255,255,255,.08);

}


.tabItem:last-child{
border-right:none;
}


.tabItem:hover{

background:rgba(255,255,255,.1);

}


.tabActive{

background:#2596D9;

color:white;

}


/* =========================
   USER ROW
========================= */

.userRow{

display:flex;

align-items:center;

gap:12px;

padding:12px;

border-radius:10px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.2s;

}


.userRow:hover{

background:rgba(255,255,255,.12);

}


/* =========================
   USER CARD
========================= */

.card{

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);

border-radius:14px;

padding:16px;

}


/* =========================
   BUTTONS
========================= */

.btn{

padding:10px;

border-radius:10px;

font-weight:600;

flex:1;

transition:.15s;

cursor:pointer;

}


.btnApprove{

background:#16a34a;

}


.btnApprove:hover{

background:#15803d;

}


.btnReject{

background:#dc2626;

}


.btnReject:hover{

background:#b91c1c;

}


.btnRestore{

background:#3FA9F5;

}


.btnRestore:hover{

background:#1e81ce;

}


/* =========================
   AVATAR
========================= */

.avatar{

width:70px;

height:70px;

border-radius:50%;

object-fit:cover;

border:2px solid rgba(255,255,255,.15);

}


/* =========================
   TEXT HELPERS
========================= */

.textMuted{

opacity:.65;

font-size:12px;

}

</style>

</head>


<body class="flex justify-center font-[Inter] text-white">

<div class="w-full max-w-[420px] min-h-screen flex flex-col">


<!-- HEADER -->

<header class="flex items-center gap-3 p-5 border-b border-white/10">

<button id="backBtn"
class="text-white/70 text-lg">

<i class="bi bi-arrow-left"></i>

</button>

<h1 class="text-lg font-semibold flex-1">

Gestion des membres

</h1>

</header>



<!-- TABS -->

<div class="tabsContainer">

<button id="tabActive" class="tabItem tabActive">
Actifs
</button>

<button id="tabPending" class="tabItem">
En attente
</button>

<button id="tabRejected" class="tabItem">
Refusés
</button>

</div>

<!-- USERS LIST -->

<main
id="usersList"
class="flex-1 overflow-y-auto p-5 space-y-3">

<div class="text-xs uppercase tracking-wide opacity-60 mb-2">
Liste des utilisateurs
</div>

<div id="usersContainer"
class="space-y-2">

<!-- Injecté par JS -->

</div>

</main>

<!-- USER DETAIL MODAL -->

<div
id="userDetailModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-5">

<div class="w-full max-w-md">

<!-- HEADER MODAL -->

<div class="flex items-center justify-between mb-3">

<div class="text-xs uppercase tracking-wide opacity-70">
Dossier utilisateur
</div>

<button
id="closeUserModal"
class="text-white/60 hover:text-white text-lg">

<i class="bi bi-x-lg"></i>

</button>

</div>


<!-- CARD -->

<div
id="userDetailCard"
class="card space-y-4">

<!-- Injecté par JS -->

</div>

</div>

</div>


</div>


<script type="module"
src="/myUm/admin/js/users-management.js"></script>

</body>
</html>
