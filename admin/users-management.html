<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:linear-gradient(180deg,#0f2145,#1A3668);
}

.tab{
flex:1;
text-align:center;
padding:12px;
font-size:13px;
cursor:pointer;
opacity:.6;
border-bottom:2px solid transparent;
}

.tab.active{
opacity:1;
border-bottom:2px solid #3FA9F5;
}

.userRow{
display:flex;
align-items:center;
gap:12px;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
}

.userRow:hover{
background:rgba(255,255,255,.12);
}

.card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:16px;
}

.btn{
padding:10px;
border-radius:10px;
font-weight:600;
}

.btnApprove{
background:#16a34a;
}

.btnReject{
background:#dc2626;
}

.searchBox{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
padding:10px;
color:white;
width:100%;
}

</style>

</head>

<body class="flex justify-center font-[Inter] text-white">

<div class="w-full max-w-[420px] min-h-screen flex flex-col">


<header class="flex items-center gap-3 p-5 border-b border-white/10">

<button onclick="window.location.href='/myUm/public/dashboard.html'"
class="text-white/60 text-lg">

<i class="bi bi-arrow-left"></i>

</button>

<h1 class="text-lg font-semibold flex-1">
Gestion des membres
</h1>

</header>


<!-- TABS -->

<div class="flex border-b border-white/10">

<div class="tab active" data-status="active">
Actifs
</div>

<div class="tab" data-status="pending">
Non approuvés
</div>

<div class="tab" data-status="rejected">
Refusés
</div>

</div>


<!-- SEARCH -->

<div class="p-4 space-y-3">

<input id="searchInput"
placeholder="Recherche utilisateur..."
class="searchBox">

<select id="sortSelect"
class="searchBox">

<option value="date">Date inscription</option>
<option value="age">Age</option>

</select>

</div>


<!-- USERS LIST -->

<div id="usersList"
class="flex-1 overflow-y-auto p-4 space-y-2"></div>


<!-- USER DETAIL -->

<div id="userDetailView"
class="hidden flex-1 overflow-y-auto p-5 space-y-4"></div>


</div>

<script type="module"
src="/myUm/admin/js/users-management.js"></script>

</body>
</html>
