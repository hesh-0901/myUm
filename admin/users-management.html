<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">

<meta name="theme-color" content="#1A3668">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
theme:{
extend:{
colors:{
primary:"#1A3668",
medium:"#2596D9",
lightblue:"#3FA9F5"
}
}
}
}
</script>

<style>

/* BACKGROUND FUTURISTE */

body{
background:
radial-gradient(circle at 20% 20%, rgba(63,169,245,0.15), transparent 40%),
radial-gradient(circle at 80% 30%, rgba(37,150,217,0.2), transparent 40%),
linear-gradient(180deg,#0a1328,#111f3d,#091227);
}


/* DOSSIER FUTURISTE */

.folder{

position:relative;

padding:18px;

border-radius:16px;

background:linear-gradient(
180deg,
rgba(255,255,255,0.06),
rgba(255,255,255,0.02)
);

border:1px solid rgba(255,255,255,0.1);

backdrop-filter:blur(12px);

transition:all .25s ease;

cursor:pointer;

}


/* TAB DU DOSSIER */

.folder::before{

content:"";

position:absolute;

top:-10px;

left:20px;

width:70px;

height:18px;

background:linear-gradient(
90deg,
#2596D9,
#3FA9F5
);

border-radius:8px 8px 0 0;

opacity:.85;

}


/* LIGNE TECH */

.folder::after{

content:"";

position:absolute;

bottom:0;

left:0;

height:2px;

width:100%;

background:linear-gradient(
90deg,
transparent,
#3FA9F5,
transparent
);

opacity:.4;

}


/* HOVER */

.folder:hover{

transform:translateY(-4px) scale(1.03);

border-color:#3FA9F5;

box-shadow:

0 0 15px rgba(63,169,245,0.4),
0 0 35px rgba(37,150,217,0.25);

}


/* BUBBLE */

.bubble{

position:absolute;

top:-8px;

right:-6px;

background:#ff3b3b;

color:white;

font-size:10px;

font-weight:600;

padding:2px 7px;

border-radius:50px;

box-shadow:0 0 10px rgba(255,0,0,0.6);

}


/* ICON */

.folderIcon{

font-size:30px;

color:#3FA9F5;

}


/* TITLE */

.folderTitle{

margin-top:8px;

font-size:13px;

font-weight:600;

letter-spacing:.3px;

color:white;

}

</style>

</head>



<body class="flex justify-center font-[Inter]">

<div class="w-full max-w-[420px] min-h-screen text-white flex flex-col">


<!-- HEADER -->

<header class="flex items-center gap-3 p-5 border-b border-white/10">

<a href="/myUm/public/dashboard.html"
class="text-white/70 text-lg hover:text-white">

<i class="bi bi-arrow-left"></i>

</a>

<h1 class="text-lg font-semibold tracking-wide">
Gestion des membres
</h1>

</header>



<!-- MAIN -->

<main class="flex-1 overflow-y-auto p-5">

<div class="grid grid-cols-2 gap-4" id="foldersGrid">


<!-- DOSSIER -->

<div class="folder">

<div class="bubble">5</div>

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Choriste
</div>

</div>



<div class="folder">

<div class="bubble">2</div>

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Administrateur
</div>

</div>



<div class="folder">

<div class="bubble">1</div>

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Corps administratif
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Président
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Vice Président
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Responsable UM
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Comité chorale
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Conducteur
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Instrumentiste
</div>

</div>



<div class="folder">

<i class="bi bi-folder2-open folderIcon"></i>

<div class="folderTitle">
Visiteur
</div>

</div>



</div>

</main>

</div>


<script type="module" src="/myUm/admin/js/users-management.js"></script>

</body>
</html>
