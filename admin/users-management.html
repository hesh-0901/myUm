<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Gestion membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body data-title="Gestion des membres"
class="bg-gray-100 flex justify-center overflow-x-hidden font-[Inter]">


<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">


<!-- HEADER BACK -->

<header id="header-back"></header>

<div class="h-16"></div>

<!-- contenu -->



<!-- ADMIN STATS -->

<div class="px-5 pt-4 space-y-3">

<div class="grid grid-cols-3 gap-2 text-center text-xs">

<div class="rounded-xl bg-gray-100 p-3">

<div id="countActive" class="text-lg font-semibold">0</div>

<div class="opacity-60">Actifs</div>

</div>

<div class="rounded-xl bg-gray-100 p-3">

<div id="countPending" class="text-lg font-semibold">0</div>

<div class="opacity-60">En attente</div>

</div>

<div class="rounded-xl bg-gray-100 p-3">

<div id="countRejected" class="text-lg font-semibold">0</div>

<div class="opacity-60">Refusés</div>

</div>

</div>


<!-- SEARCH -->
<div class="flex gap-2">

<input
id="searchInput"
type="text"
placeholder="Rechercher utilisateur..."
class="flex-1 p-3 rounded-xl border text-sm">


<select
id="choraleFilter"
class="w-32 p-3 rounded-xl border text-sm bg-white">

<option value="">Tous</option>
<option value="PC">Prophetic Choir</option>
<option value="WS">Wake up song</option>
<option value="VN">Vent Nouveau</option>
<option value="IN">Instrumentiste</option>
<option value="AD">Administration</option>
<option value="GT">Visiteur</option>

</select>

</div>


<!-- TABS -->

<div class="flex m-4 bg-gray-100 border rounded-xl overflow-hidden text-sm">

<button id="tabActive"
class="flex-1 py-2 font-medium text-center bg-[#2596D9] text-white">

Actifs

</button>

<button id="tabPending"
class="flex-1 py-2 font-medium text-center">

En attente

</button>

<button id="tabRejected"
class="flex-1 py-2 font-medium text-center">

Refusés

</button>

</div>



<!-- USERS LIST -->

<main
id="usersList"
class="flex-1 overflow-y-auto p-5 space-y-3">

<div class="text-xs uppercase tracking-wide opacity-60 mb-2">

Liste des utilisateurs

</div>

<div id="usersContainer" class="divide-y"></div>

<button id="loadMoreBtn"
class="w-full py-3 text-sm text-blue-600 font-medium">

Charger plus

</button>

</div>

</main>



</div>



<!-- USER DETAIL MODAL -->

<div
id="userDetailModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-5">

<div class="w-full max-w-md space-y-3">

<div class="flex items-center justify-between">

<div class="text-xs uppercase tracking-wide opacity-70">

Dossier utilisateur

</div>

<button id="closeUserModal" class="text-gray-500 text-lg">

<i class="bi bi-x-lg"></i>

</button>

</div>


<div
id="userDetailCard"
class="rounded-3xl shadow-sm p-5 bg-white space-y-4">

</div>

</div>

</div>



<script type="module"
src="/myUm/partials/js/back-header.js"></script>

<script type="module"
src="/myUm/admin/js/users-management.js"></script>

<script type="module"
src="/myUm/mains.js/app-init.js"></script>

</body>
</html>
