<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des annonces</title>
    <link rel="stylesheet" href="css/annonce-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.ckeditor.com/4.21.0/standard/ckeditor.js"></script>
</head>
<body>

<h1>Gestion des annonces</h1>

<!-- Formulaire ajout -->
<form id="addForm">
    <input type="text" id="titre" placeholder="Titre" required>
    <textarea id="message" placeholder="Message" required></textarea>
    <input type="text" id="categorie" placeholder="Catégorie" required>
    <input type="date" id="date_publication" required>
    <button type="submit">Ajouter</button>
</form>

<!-- Liste des annonces -->
<div id="annonces"></div>

<!-- Pagination -->
<div class="pagination">
    <button id="prevBtn">Précédent</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Suivant</button>
</div>

<script src="js/annonce-admin.js"></script>
</body>

</html>
