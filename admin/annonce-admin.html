<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MyUm</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/annonce-admin.css">
</head>
<body>
    <div class="container">
        <h1>Gestion des annonces</h1>

        <!-- Formulaire ajout -->
        <form id="addForm">
            <input type="text" id="titre" placeholder="Titre" required>
            <textarea id="message" placeholder="Message" required></textarea>
            <input type="text" id="categorie" placeholder="Catégorie" required>
            <input type="date" id="date_publication" required>
            <button type="submit">Ajouter</button>
        </form>

        <!-- Liste des annonces -->
        <div id="annonces"></div>

        <!-- Pagination -->
        <div class="pagination">
            <button id="prevBtn">Précédent</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextBtn">Suivant</button>
        </div>
    </div>

    <script src="js/annonce-admin.js"></script>
</body>
</html>
