<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salons de présence - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="icon" href="/myUm/assets/favicon.png">

<meta name="theme-color" content="#1A3668">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary:'#1A3668',
        medium:'#2596D9',
        lightblue:'#3FA9F5',
        danger:'#DC2626'
      }
    }
  }
}
</script>

</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-back"></header>

<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-6">

<!-- TOP BAR -->
<div class="flex items-center justify-between">

<p class="text-lg font-semibold text-gray-800">
Salons
</p>

<div class="flex items-center gap-4">

<button id="searchBtn" class="text-gray-500 text-lg active:scale-95 transition">
<i class="bi bi-search"></i>
</button>

<button id="filterBtn" class="text-gray-500 text-lg active:scale-95 transition">
<i class="bi bi-funnel"></i>
</button>

<button id="sortBtn" class="text-gray-500 text-lg active:scale-95 transition">
<i class="bi bi-sort-down"></i>
</button>

</div>

</div>

<!-- SEARCH -->
<div id="searchContainer" class="hidden">
<input
type="text"
id="searchInput"
placeholder="Rechercher un salon..."
class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary text-sm">
</div>

<!-- LISTE DES SALONS -->
<div id="roomsList" class="space-y-3">

<!-- EXEMPLE CARD (sera généré en JS) -->
<div class="bg-white rounded-3xl shadow-sm p-4 space-y-2">

<div class="flex justify-between items-start">

<div class="space-y-1">

<!-- LIGNE PRINCIPALE -->
<p class="text-sm font-medium text-gray-800 leading-snug">
27/03/2026 • PC • Hénoch • Culte
</p>

<!-- DESCRIPTION -->
<p class="text-xs text-gray-500 line-clamp-2">
Répétition générale avant le culte dominical
</p>

</div>

<!-- BADGE -->
<span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-600">
Actif
</span>

</div>

</div>

</div>

</main>

</div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/presence-details.js"></script>
<script type="module" src="/myUm/partials/js/back-header.js"></script>

</body>
</html>
