<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détails Présence</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-gray-50 font-[Inter] text-gray-800 pt-16">

<!-- HEADER INJECTÉ -->
<div id="headerContainer"></div>

<div class="max-w-6xl mx-auto px-4 py-8 space-y-8">

  <!-- ROOM CARD -->
  <div class="bg-white rounded-3xl shadow-sm border p-6 space-y-3">
    <div id="roomInfo" class="grid md:grid-cols-2 gap-4 text-sm"></div>

    <div class="flex flex-wrap gap-3 pt-4">

      <button id="reopenRoom"
        class="hidden px-4 py-2 rounded-xl border text-sm flex items-center gap-2">
        <i class="bi bi-unlock"></i> Réouvrir
      </button>

      <button id="approveRoom"
        class="hidden px-4 py-2 rounded-xl bg-green-600 text-white text-sm flex items-center gap-2">
        <i class="bi bi-check-circle"></i> Approuver
      </button>

      <button id="disapproveRoom"
        class="hidden px-4 py-2 rounded-xl bg-red-600 text-white text-sm flex items-center gap-2">
        <i class="bi bi-x-circle"></i> Désapprouver
      </button>

      <div class="ml-auto flex gap-3">

        <button id="exportPDF"
          class="w-10 h-10 rounded-xl bg-gray-800 text-white flex items-center justify-center">
          <i class="bi bi-file-earmark-pdf"></i>
        </button>

        <button id="exportXLS"
          class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center">
          <i class="bi bi-file-earmark-excel"></i>
        </button>

      </div>

    </div>
  </div>

  <!-- PARTICIPANTS -->
  <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">

    <div class="flex justify-between items-center p-5 border-b">
      <h3 class="text-sm font-semibold tracking-wide">
        Liste des participants
      </h3>

      <button id="openAddMember"
        class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shadow">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3 text-left">#</th>
            <th class="px-4 py-3 text-left">Nom</th>
            <th class="px-4 py-3 text-left">Username</th>
            <th class="px-4 py-3 text-center">Genre</th>
            <th class="px-4 py-3 text-left">Méthode</th>
            <th class="px-4 py-3 text-left">Horodatage</th>
            <th class="px-4 py-3 text-center">Action</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody"
          class="divide-y divide-gray-100">
        </tbody>
      </table>
    </div>

  </div>

</div>

<!-- MODAL INJECTÉ -->
<div id="modalContainer"></div>

<script type="module" src="/myUm/admin/js/presence-details.js"></script>
</body>
</html>
