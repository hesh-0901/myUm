<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Présence - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

  <header id="header"></header>

  <main class="flex-1 overflow-y-auto">

    <!-- ACTIONS (ultra léger) -->
    <div class="flex justify-end gap-2 px-4 pt-3">

      <button id="openRadarBtn"
        class="p-2 rounded-xl active:scale-95 transition">
        <i class="bi bi-broadcast text-base text-gray-600"></i>
      </button>

      <button id="addManualBtn"
        class="p-2 rounded-xl active:scale-95 transition">
        <i class="bi bi-plus text-base text-gray-800"></i>
      </button>

    </div>

    <!-- INFOS -->
    <div id="roomInfo" class="px-4 pt-3"></div>

    <!-- COMPTEUR -->
    <div id="presenceCount" class="px-4 pt-2 text-xs text-gray-400"></div>

    <!-- LISTE -->
    <div id="presenceList" class="mt-2"></div>

  </main>

</div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>

<script type="module">
import { loadPartial } from "/myUm/partials/js/load-partial.js";
await loadPartial("header-back", "#header");
</script>

<script type="module" src="/myUm/admin/js/presence-details.js"></script>

</body>
</html>
