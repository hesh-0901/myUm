<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Présence - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary:'#1A3668',
        medium:'#2596D9'
      }
    }
  }
}
</script>

</head>

<body class="bg-gray-100 flex justify-center font-[Inter]">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<!-- HEADER -->
<header id="header-back"></header>

<!-- CONTENT -->
<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-5">

  <!-- ACTIONS -->
  <div class="flex gap-2">

    <!-- RADAR -->
    <button id="openRadarBtn"
    class="flex-1 bg-gradient-to-r from-primary to-medium text-white py-3 rounded-xl text-sm font-semibold active:scale-95 transition flex items-center justify-center gap-2">
      <i class="bi bi-broadcast"></i>
      Radar
    </button>

    <!-- ADD -->
    <button id="addManualBtn"
    class="w-14 flex items-center justify-center rounded-xl border border-gray-200 text-gray-600 active:scale-95 transition">
      <i class="bi bi-plus"></i>
    </button>

  </div>

  <!-- ROOM INFO -->
  <div id="roomInfo" class="space-y-2"></div>

  <!-- COUNT -->
  <p id="presenceCount" class="text-xs text-gray-400"></p>

  <!-- LIST -->
  <div id="presenceList" class="space-y-3"></div>

</main>

</div>

<!-- SCRIPTS -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/presence-details.js"></script>
<script type="module" src="/myUm/partials/js/back-header.js"></script>

</body>
</html>
