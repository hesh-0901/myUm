<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Présences - MyUm</title>

<link rel="icon" href="/myUm/assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-back"></header>

<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-5">

<!-- TOP BAR ACTIONS -->
<div class="flex items-center justify-between">

<p class="text-lg font-semibold text-gray-800">
Présences
</p>

<div class="flex items-center gap-3">

<button id="searchBtn" class="text-gray-500 text-lg">
<i class="bi bi-search"></i>
</button>

<button id="filterBtn" class="text-gray-500 text-lg">
<i class="bi bi-funnel"></i>
</button>

<button id="sortBtn" class="text-gray-500 text-lg">
<i class="bi bi-sort-down"></i>
</button>

</div>

</div>

<!-- SEARCH BAR (HIDDEN) -->
<div id="searchContainer" class="hidden">
<input
type="text"
id="searchInput"
placeholder="Rechercher..."
class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary text-sm">
</div>

<!-- INFOS SALON -->
<div id="roomInfo" class="bg-white rounded-3xl shadow-sm p-4 space-y-1">
<p class="text-sm text-gray-500">Chargement...</p>
</div>

<!-- COMPTEUR -->
<div class="bg-white rounded-3xl shadow-sm p-4 flex justify-between items-center">
<p class="text-sm text-gray-600">Présents</p>
<p id="totalCount" class="text-lg font-semibold">0</p>
</div>

<!-- LISTE -->
<div id="presenceList" class="space-y-3"></div>

</main>

</div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/presence-management-1.js"></script>
<script type="module" src="/myUm/admin/js/presence-management-2.js"></script>
<script type="module" src="/myUm/partials/js/back-header.js"></script>

</body>
</html>
