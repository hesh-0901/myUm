<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Détails présence - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header id="header"></header>

  <!-- MAIN -->
  <main class="flex-1 overflow-y-auto">

    <!-- ACTIONS -->
    <div class="flex justify-end items-center gap-2 p-4">

      <!-- RADAR -->
      <button id="openRadarBtn"
        class="p-2 rounded-xl bg-gray-100 active:scale-95 transition">
        <i class="bi bi-broadcast text-sm text-gray-700"></i>
      </button>

      <!-- AJOUT MANUEL -->
      <button id="addManualBtn"
        class="p-2 rounded-xl bg-gradient-to-r from-medium to-lightblue active:scale-95 transition">
        <i class="bi bi-plus text-sm text-white"></i>
      </button>

    </div>

    <!-- INFOS SALON -->
    <div id="roomInfo"></div>

    <!-- LISTE PRESENCES -->
    <div id="presenceList" class="divide-y divide-gray-100"></div>

  </main>

  <!-- FOOTER / NAV (non utilisé ici mais gardé propre si besoin futur) -->
  <footer id="nav"></footer>

</div>


<!-- INIT GLOBAL -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>

<!-- PARTIALS -->
<script type="module">

import { loadPartial } from "/myUm/partials/js/load-partial.js";

// Page secondaire → header-back uniquement
await loadPartial("header-back", "#header");

// Pas de nav ici (page secondaire)

</script>

<!-- PAGE LOGIC -->
<script type="module" src="/myUm/admin/js/presence-details.js"></script>

</body>
</html>
