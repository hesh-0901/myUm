<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Membres - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary:'#1A3668',
        medium:'#2596D9'
      }
    }
  }
}
</script>

</head>

<body class="bg-gray-100 flex justify-center font-[Inter]">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<!-- HEADER -->
<header id="header-back"></header>

<!-- CONTENT -->
<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-5">

  <!-- SEARCH + IMPORT -->
  <div class="flex gap-2">

    <input
    id="searchInput"
    placeholder="Rechercher membre..."
    class="flex-1 p-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-primary">

    <button id="importBtn"
    class="w-12 flex items-center justify-center rounded-xl border border-gray-200 text-gray-500 active:scale-95 transition">
      <i class="bi bi-upload"></i>
    </button>

  </div>

  <!-- ADD -->
  <button id="addBtn"
  class="w-full bg-gradient-to-r from-primary to-medium text-white py-3 rounded-xl text-sm font-semibold active:scale-95 transition">
    Ajouter un membre
  </button>

  <!-- LIST -->
  <div id="membersList" class="space-y-3"></div>

</main>

</div>

<!-- ================= MODAL ADD / EDIT ================= -->
<div id="memberModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl p-5 space-y-4">

    <div class="flex justify-between items-center">
      <p class="text-lg font-semibold">Membre</p>
      <button id="closeModal" class="text-gray-400">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="space-y-3">

      <input id="modalName"
      placeholder="Nom complet"
      class="w-full p-3 rounded-xl border text-sm">

      <input id="modalMatricule"
      placeholder="Matricule"
      class="w-full p-3 rounded-xl border text-sm">

    </div>

    <button id="saveMember"
    class="w-full bg-gradient-to-r from-primary to-medium text-white py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">

      <span id="btnText">Enregistrer</span>

      <span id="btnLoader"
      class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>

    </button>

  </div>

</div>

<!-- ================= MODAL DELETE ================= -->
<div id="confirmModal"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">

  <div class="bg-white rounded-3xl p-5 w-full max-w-sm space-y-4">

    <p class="text-sm font-medium text-center">
      Supprimer ce membre ?
    </p>

    <div class="flex gap-2">

      <button id="cancelDelete"
      class="flex-1 p-3 rounded-xl border text-sm">
        Annuler
      </button>

      <button id="confirmDelete"
      class="flex-1 p-3 rounded-xl bg-red-500 text-white text-sm">
        Supprimer
      </button>

    </div>

  </div>

</div>

<!-- ================= TOAST ================= -->
<div id="toast"
class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white text-sm px-4 py-2 rounded-xl shadow-md z-50">
</div>

<!-- IMPORT FILE -->
<input type="file" id="importFile" class="hidden">

<!-- SCRIPTS -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/members-management.js"></script>
<script type="module" src="/myUm/partials/js/back-header.js"></script>

</body>
</html>
