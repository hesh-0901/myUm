<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouvrir un Salon - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="icon" href="/myUm/assets/favicon.ico">

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary:'#1A3668',
medium:'#2596D9',
danger:'#DC2626'
}
}
}
}
</script>

</head>

<body data-title="Ouvrir un salon de présence"
class="bg-gray-100 flex justify-center overflow-x-hidden">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-back"></header>

<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-6">

<!-- STATUS CARD -->

<div class="bg-white rounded-3xl shadow-sm p-5 space-y-1">

<p id="activeRoomStatus"
class="text-xs text-gray-500">

Vérification du salon actif...

</p>

</div>

<!-- PARAMETRES SALON -->

<div class="bg-white rounded-3xl shadow-sm p-5 space-y-4">

<p class="text-sm font-semibold text-gray-700">
Paramètres du salon
</p>

<!-- DATE -->

<div>

<label class="text-xs text-gray-500 flex items-center gap-1">

<i class="bi bi-calendar3"></i>
Date

</label>

<input
type="date"
id="roomDate"
class="w-full mt-1 p-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">

</div>

<!-- CHORALE -->

<div>

<label class="text-xs text-gray-500 flex items-center gap-1">

<i class="bi bi-people"></i>
Chorale

</label>

<select
id="roomChorale"
class="w-full mt-1 p-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">

<option value="">
Sélectionner
</option>

<option value="PC">
Chorale PC
</option>

<option value="WS">
Chorale WS
</option>

<option value="VN">
Chorale VN
</option>

<option value="UM">
Chorale UM
</option>

</select>

</div>

<!-- TYPE -->

<div>

<label class="text-xs text-gray-500 flex items-center gap-1">

<i class="bi bi-diagram-3"></i>
Type de rencontre

</label>

<select
id="roomType"
class="w-full mt-1 p-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">

<option value="">
Sélectionner
</option>

<option>
Réunion de prière
</option>

<option>
Réunion
</option>

<option>
Répétition
</option>

<option>
Sortie
</option>

<option>
Culte des dimanches
</option>

<option>
Culte des semaines
</option>

</select>

</div>

<!-- DESCRIPTION -->

<div>

<label class="text-xs text-gray-500 flex items-center gap-1">

<i class="bi bi-card-text"></i>
Description

</label>

<textarea
id="roomDescription"
rows="3"
class="w-full mt-1 p-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary">
</textarea>

</div>

</div>

<!-- MODE DUREE -->

<div class="bg-white rounded-3xl shadow-sm p-5 space-y-3">

<p class="text-sm font-semibold text-gray-700">
Durée du salon
</p>

<div class="grid grid-cols-2 gap-3">

<button id="modeHours"

class="flex items-center justify-center gap-2 p-3
border rounded-xl text-sm
border-gray-200 hover:border-primary">

<i class="bi bi-clock"></i>
Heures fixes

</button>

<button id="modeTimer"

class="flex items-center justify-center gap-2 p-3
border rounded-xl text-sm
border-gray-200 hover:border-primary">

<i class="bi bi-stopwatch"></i>
Chronomètre

</button>

</div>

<div id="hoursContainer"
class="hidden grid grid-cols-2 gap-3 pt-2">

<input
type="time"
id="startTime"
class="p-2 rounded-xl border border-gray-200">

<input
type="time"
id="endTime"
class="p-2 rounded-xl border border-gray-200">

</div>

<div id="timerContainer"
class="hidden space-y-2 pt-2">

<select
id="timerDuration"
class="w-full p-2 rounded-xl border border-gray-200">

<option value="">
Durée
</option>

<option value="5">
5 minutes
</option>

<option value="10">
10 minutes
</option>

<option value="custom">
Personnalisée
</option>

</select>

<input
type="number"
id="customTimer"
placeholder="Minutes personnalisées"
class="hidden w-full p-2 rounded-xl border border-gray-200">

</div>

</div>

<!-- ACTIONS -->

<div class="space-y-3">

<button
id="openRoomBtn"

class="w-full flex items-center justify-center gap-3
bg-gradient-to-r from-primary to-medium
text-white py-4 rounded-2xl shadow-md
active:scale-95 transition">

<i class="bi bi-broadcast text-lg"></i>

<span class="font-semibold">
Ouvrir le salon
</span>

</button>

<div class="grid grid-cols-2 gap-3">

<button
id="launchRadarBtn"

class="hidden flex items-center justify-center gap-2
bg-black text-white py-3 rounded-xl
shadow-sm active:scale-95 transition">

<i class="bi bi-radar"></i>
Radar

</button>

<button
id="forceStopBtn"

class="hidden flex items-center justify-center gap-2
bg-danger text-white py-3 rounded-xl
shadow-sm active:scale-95 transition">

<i class="bi bi-stop-circle"></i>
Stop

</button>

</div>

</div>

</main>

</div>

<div id="radarContainer"></div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>

<script type="module" src="/myUm/admin/js/open-room.js"></script>

<script type="module">

document.addEventListener("DOMContentLoaded", async () => {

try {

const radar = await fetch("/myUm/partials/radar.html");
document.getElementById("radarContainer").innerHTML = await radar.text();

} catch(error) {

console.error("Erreur chargement partials :", error);

}

});

</script>

<script type="module" src="/myUm/partials/js/back-header.js"></script>
<script type="module" src="/myUm/mains.js/pwa-install.js"></script>

</body>
</html>
