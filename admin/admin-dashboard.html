<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<title>Dashboard Admin</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
.text-primary { color:#1A3668; }
.bg-primary-light { background:#EEF4FF; }
</style>
</head>

<body 
class="bg-gray-100 flex justify-center overflow-x-hidden"
data-title="Dashboard Admin">

<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<header id="header-back"></header>
<main class="flex-1 overflow-y-auto px-4 pt-6 pb-6 space-y-5">
<div class="flex items-center justify-between">

<h1 class="text-xl font-semibold text-gray-800 tracking-tight">
Dashboard Admin
</h1>

<i class="bi bi-speedometer2 text-gray-400"></i>

</div>


<!-- ================= TOTAL ================= -->
<div class="bg-primary-light rounded-3xl p-5 shadow-sm flex items-center justify-between">

<div>
<p class="text-xs text-gray-500">Total choristes</p>
<p id="totalUsers" class="text-2xl font-semibold text-primary mt-1">0</p>
</div>

<div class="bg-white p-3 rounded-xl shadow-sm">
<i class="bi bi-people text-primary text-xl"></i>
</div>

</div>

<!-- ================= GENRE ================= -->
<div class="grid grid-cols-3 gap-3">

<!-- HOMMES -->
<div class="bg-green-50 p-4 rounded-3xl shadow-sm text-center">

<div class="flex justify-center mb-2">
<i class="bi bi-person-fill text-green-600 text-lg"></i>
</div>

<p class="text-xs text-gray-500">H</p>
<p id="countH" class="text-lg font-semibold text-green-600">0</p>

</div>

<!-- FEMMES -->
<div class="bg-pink-50 p-4 rounded-3xl shadow-sm text-center">

<div class="flex justify-center mb-2">
<i class="bi bi-person-fill text-pink-600 text-lg"></i>
</div>

<p class="text-xs text-gray-500">F</p>
<p id="countM" class="text-lg font-semibold text-pink-600">0</p>

</div>

<!-- NON MENTIONNÉ -->
<div class="bg-gray-100 p-4 rounded-3xl shadow-sm text-center">

<div class="flex justify-center mb-2">
<i class="bi bi-person text-gray-600 text-lg"></i>
</div>

<p class="text-xs text-gray-500">NM</p>
<p id="countNM" class="text-lg font-semibold text-gray-600">0</p>

</div>

</div>

<!-- ================= CHORALES ================= -->
<div>

<div class="flex items-center justify-between mb-2">
<h2 class="text-sm font-semibold text-gray-700">Par chorale</h2>
<i class="bi bi-bar-chart text-gray-400"></i>
</div>

<div id="choraleContainer" class="space-y-3"></div>

</div>

</main>

</div>

<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/admin/js/dashboard.js"></script>

</body>
</html>
