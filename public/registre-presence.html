<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registre des présences - MyUm</title>

<link rel="manifest" href="/myUm/manifest.json">
<link rel="icon" href="/myUm/assets/favicon.png">
<meta name="theme-color" content="#1A3668">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary:'#1A3668',
medium:'#2596D9',
lightblue:'#3FA9F5',
danger:'#DC2626'
},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

</head>

<body class="bg-gray-100 flex justify-center overflow-x-hidden font-display">

<!-- APP CONTAINER -->
<div class="w-full max-w-[420px] min-h-screen bg-white flex flex-col overflow-hidden">

<!-- HEADER BACK -->
<header id="header-back"></header>

<!-- MAIN -->
<main class="flex-1 overflow-y-auto px-4 pt-20 pb-6 space-y-6">

<!-- TITLE -->
<div>
<h1 class="text-lg font-semibold text-gray-800">
Registre des présences
</h1>
<p class="text-xs text-gray-500">
Historique et statistiques personnelles
</p>
</div>

<!-- LISTE DES SALONS -->
<div id="roomsList" class="space-y-3"></div>

<!-- EMPTY STATE -->
<div id="emptyState" class="hidden text-center text-gray-400 text-sm">
Aucune donnée disponible
</div>

<!-- STATS -->
<div class="bg-white rounded-3xl shadow-sm p-5 space-y-2">

<div class="flex justify-between items-center">

<h2 class="text-sm font-semibold text-gray-700">
Statistiques
</h2>

<span id="statsPercent" class="text-xs text-gray-400">
0%
</span>

</div>

<div class="w-full h-1 bg-gray-200 rounded-full overflow-hidden">

<div
id="statsBar"
class="h-full bg-gradient-to-r from-medium to-lightblue transition-all duration-500"
style="width:0%">
</div>

</div>

<p id="statsText" class="text-xs text-gray-500 mt-2"></p>

</div>

</main>

</div>

<!-- SCRIPTS -->
<script type="module" src="/myUm/mains.js/app-init.js"></script>
<script type="module" src="/myUm/public/registre-presence.js"></script>
<script type="module" src="/myUm/partials/js/back-header.js"></script>

</body>

</html>
