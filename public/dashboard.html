<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="icon" href="/myUm/assets/favicon.png">

<script>
tailwind.config = {
theme: {
extend: {
colors: {

bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'

},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

<style>

body{
background:#011C40;
}

.app-container{
max-width:420px;
margin:auto;
 }

.action-pill{
display:flex;
align-items:center;
gap:6px;
padding:6px 12px;
background:#023859;
color:#A7EBF2;
border-radius:999px;
font-size:12px;
white-space:nowrap;
border:1px solid rgba(255,255,255,0.08);
transition:all .2s ease;
flex-shrink:0;
}

.action-pill:hover{
background:#26658C;
color:white;
}

#quickActions{
scrollbar-width:none;
-ms-overflow-style:none;
}

#quickActions::-webkit-scrollbar{
display:none;
}

</style>

</head>

<body class="font-display pb-24 pt-20">

<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>

<div class="app-container px-4 space-y-6">

<!-- ACTIONS RAPIDES -->
<div class="relative">

<div id="quickActions"
class="flex gap-2 overflow-x-auto pb-3">

<button id="btnMessage" class="action-pill">
<i class="bi bi-chat-dots"></i>
Messagerie
</button>

<button id="btnAgenda" class="action-pill">
<i class="bi bi-calendar"></i>
Agenda
</button>

<button id="btnPublication" class="action-pill">
<i class="bi bi-pencil"></i>
Publication
</button>

<button id="btnPresenceRoom" class="action-pill">
<i class="bi bi-clipboard-check"></i>
Présence
</button>

<button id="btnJustification" class="action-pill">
<i class="bi bi-file-earmark-text"></i>
Justifier
</button>

</div>

</div>

<!-- CARD PARTICIPATION -->
<div class="bg-card rounded-2xl p-4 shadow-md">

<div class="flex items-center justify-between mb-2 text-soft">

<div class="flex items-center gap-2">
<i class="bi bi-pie-chart-fill text-sm"></i>

<h2 class="font-semibold text-xs">
Taux de participation
</h2>
</div>

<button
id="openRegisterBtn"
class="text-xs text-soft/60 hover:text-soft transition">

<i class="bi bi-chevron-right"></i>

</button>

</div>

<div class="relative h-[140px] w-full flex items-end justify-center">

<canvas id="participationChart"></canvas>

<div id="percentageLabel"
class="absolute bottom-4 text-2xl font-semibold text-soft">
0%
</div>

</div>

</div>
  
<!-- PROGRESSION PROFIL -->
<div class="bg-card rounded-3xl p-5 shadow-lg">

<div class="flex justify-between items-center mb-2 text-soft">

<h2 class="font-semibold text-sm">
Profil
</h2>

<span id="profilePercent" class="text-xs text-gray-400">
0%
</span>

</div>

<div class="w-full h-1 bg-gray-700/40 rounded-full overflow-hidden">

<div
id="profileProgress"
class="h-full bg-accent rounded-full transition-all duration-700"
style="width:0%">
</div>

</div>

</div>

<!-- NOTIFICATIONS -->
<div id="notifications-container"></div>

</div> <!-- FIN app-container -->

<!-- NAVBAR -->
<div id="navbar-container"></div>

<script type="module" src="../users/js/presence-client.js"></script>
<script type="module" src="./dashboard.js"></script>
<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
