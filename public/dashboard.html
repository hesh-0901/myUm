<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon" href="/myUm/assets/favicon.png">

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: '#1A3668',
medium: '#2596D9',
lightblue: '#3FA9F5',
danger: '#DC2626'
},
fontFamily: {
display: ['Inter', 'sans-serif']
}
}
}
}
</script>

<style>
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
</style>

</head>

<body class="bg-[#F4F8FF] font-display text-gray-800 pb-24 pt-20">

<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- DASHBOARD -->
<div class="px-4 py-6 space-y-6 max-w-md mx-auto">


<!-- 🔵 ACTIONS RAPIDES (SCROLL HORIZONTAL) -->
<div>

<h2 class="font-semibold text-sm mb-3 text-primary">
Actions rapides
</h2>

<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">

<button id="btnMessage"
class="flex flex-col items-center justify-center min-w-[85px] bg-white shadow-md rounded-2xl p-3 active:scale-95 transition">

<div class="w-10 h-10 rounded-full bg-lightblue/20 flex items-center justify-center mb-1">
<i class="bi bi-chat-dots-fill text-lightblue text-lg"></i>
</div>

<p class="text-[11px] font-medium text-gray-700 text-center">
Messagerie
</p>

</button>


<button id="btnAgenda"
class="flex flex-col items-center justify-center min-w-[85px] bg-white shadow-md rounded-2xl p-3 active:scale-95 transition">

<div class="w-10 h-10 rounded-full bg-medium/20 flex items-center justify-center mb-1">
<i class="bi bi-calendar-week text-medium text-lg"></i>
</div>

<p class="text-[11px] font-medium text-gray-700 text-center">
Agenda
</p>

</button>


<button id="btnPublication"
class="flex flex-col items-center justify-center min-w-[85px] bg-white shadow-md rounded-2xl p-3 active:scale-95 transition">

<div class="w-10 h-10 rounded-full bg-lightblue/20 flex items-center justify-center mb-1">
<i class="bi bi-pencil-square text-lightblue text-lg"></i>
</div>

<p class="text-[11px] font-medium text-gray-700 text-center">
Publication
</p>

</button>


<button id="btnPresenceRoom"
class="flex flex-col items-center justify-center min-w-[85px] bg-white shadow-md rounded-2xl p-3 active:scale-95 transition">

<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center mb-1">
<i class="bi bi-clipboard-check text-primary text-lg"></i>
</div>

<p class="text-[11px] font-medium text-gray-700 text-center">
Présence
</p>

</button>


<button id="btnJustification"
class="flex flex-col items-center justify-center min-w-[85px] bg-white shadow-md rounded-2xl p-3 active:scale-95 transition">

<div class="w-10 h-10 rounded-full bg-danger/20 flex items-center justify-center mb-1">
<i class="bi bi-file-earmark-text text-danger text-lg"></i>
</div>

<p class="text-[11px] font-medium text-gray-700 text-center">
Justifier
</p>

</button>

</div>

</div>



<!-- 🔵 TAUX PARTICIPATION -->
<div class="bg-white rounded-3xl shadow-md p-5">

<div class="flex items-center gap-2 mb-4">
<i class="bi bi-pie-chart-fill text-primary text-lg"></i>
<h2 class="font-semibold text-sm">Taux de participation</h2>
</div>

<div class="flex justify-center relative">

<canvas id="participationChart" width="180" height="180"></canvas>

<div id="percentageLabel"
class="absolute text-xl font-bold text-primary">
</div>

</div>

</div>



<!-- 🔴 ALERTE -->
<div class="bg-white rounded-3xl shadow-md p-5 border-l-4 border-danger">

<div class="flex items-center gap-2 mb-2">
<i class="bi bi-exclamation-triangle-fill text-danger text-lg"></i>
<h2 class="font-semibold text-sm text-danger">Alerte</h2>
</div>

<p class="text-sm text-gray-600">
Vous avez 2 absences consécutives.
</p>

</div>

</div>


<!-- NAVBAR -->
<div id="navbar-container"></div>



<script type="module" src="../users/js/presence-client.js"></script>

<script type="module">

import { checkAuth } from "../mains.js/auth-guard.js";
import { initHeader } from "../partials/js/header.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initApp() {

try {

const header = await fetch("../partials/header.html");
document.getElementById("header-container").innerHTML = await header.text();
await initHeader();

const sidebar = await fetch("../partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("../partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

await import("../partials/js/nav.js");

initDashboard();

} catch (error) {
console.error("Erreur chargement dashboard :", error);
}

}

initApp();

function initDashboard() {

const participationCanvas = document.getElementById("participationChart");

if (participationCanvas) {

const participation = 75;
const ctx = participationCanvas.getContext("2d");

const percentageLabel = document.getElementById("percentageLabel");
if (percentageLabel) {
percentageLabel.innerText = participation + "%";
}

new Chart(ctx, {
type: "doughnut",
data: {
datasets: [{
data: [participation, 100 - participation],
backgroundColor: [
participation >= 80 ? "#16A34A" :
participation >= 60 ? "#F59E0B" :
"#DC2626",
"#E5E7EB"
],
borderWidth: 0
}]
},
options: {
cutout: "70%",
plugins: {
tooltip: { enabled: false },
legend: { display: false }
}
}
});
}

const routes = {
btnMessage: "../chat/index.html",
btnAgenda: "agenda.html",
btnPublication: "../posts/index.html",
btnPresenceRoom: "../users/presence.html",
btnJustification: "justification.html"
};

Object.keys(routes).forEach(id => {
const btn = document.getElementById(id);
if (btn) {
btn.addEventListener("click", () => {
window.location.href = routes[id];
});
}
});

}

</script>

<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
