<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="icon" href="/myUm/assets/favicon.png">

<script>
tailwind.config = {
theme: {
extend: {
colors: {

bgmain:'#011C40',
card:'#023859',
primary:'#26658C',
accent:'#54ACBF',
soft:'#A7EBF2',
danger:'#DC2626'

},
fontFamily:{
display:['Inter','sans-serif']
}
}
}
}
</script>

<style>

body{
background:#011C40;
}

/* container app */

.app-container{
max-width:420px;
margin:auto;
}

/* actions rapides */

.action-pill{

display:flex;
align-items:center;
gap:6px;

padding:6px 12px;

background:#023859;
color:#A7EBF2;

border-radius:999px;

font-size:12px;

white-space:nowrap;

border:1px solid rgba(255,255,255,0.08);

transition:all .2s ease;

flex-shrink:0;
}

.action-pill:hover{

background:#26658C;
color:white;

}

/* scroll horizontal propre */

#quickActions{
scrollbar-width:none;
-ms-overflow-style:none;
}

#quickActions::-webkit-scrollbar{
display:none;
}

</style>

</head>

<body class="font-display pb-24 pt-20">

<!-- HEADER -->
<div id="header-container"></div>

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<div class="app-container px-4 space-y-6">

<!-- ACTIONS RAPIDES -->

<div class="relative">

<div id="quickActions"
class="flex gap-2 overflow-x-auto pb-3">

<button id="btnMessage" class="action-pill">
<i class="bi bi-chat-dots"></i>
Messagerie
</button>

<button id="btnAgenda" class="action-pill">
<i class="bi bi-calendar"></i>
Agenda
</button>

<button id="btnPublication" class="action-pill">
<i class="bi bi-pencil"></i>
Publication
</button>

<button id="btnPresenceRoom" class="action-pill">
<i class="bi bi-clipboard-check"></i>
Présence
</button>

<button id="btnJustification" class="action-pill">
<i class="bi bi-file-earmark-text"></i>
Justifier
</button>

</div>

</div>



<!-- CARD PARTICIPATION -->

<div class="bg-card rounded-3xl p-6 shadow-lg">

<div class="flex items-center gap-2 mb-4 text-soft">

<i class="bi bi-pie-chart-fill"></i>

<h2 class="font-semibold text-sm">
Taux de participation
</h2>

</div>


<!-- CONTENEUR GAUGE -->

<div class="relative h-[200px] w-full flex items-end justify-center">

<canvas id="participationChart"></canvas>

<!-- POURCENTAGE -->

<div id="percentageLabel"
class="absolute bottom-6 text-3xl font-semibold text-soft">
75%
</div>

</div>

</div>



<!-- ALERTE -->

<div class="bg-card rounded-3xl p-5 shadow-lg border-l-4 border-danger">

<div class="flex items-center gap-2 mb-2 text-danger">

<i class="bi bi-exclamation-triangle-fill"></i>

<h2 class="font-semibold text-sm">
Alerte
</h2>

</div>

<p class="text-sm text-gray-300">
Vous avez 2 absences consécutives.
</p>

</div>

</div>



<!-- NAVBAR -->
<div id="navbar-container"></div>



<script type="module" src="../users/js/presence-client.js"></script>

<script type="module">

import { checkAuth } from "../mains.js/auth-guard.js";
import { initHeader } from "../partials/js/header.js";
import { initSidebar } from "../partials/js/sidebar.js";

checkAuth();

async function initApp(){

try{

const header = await fetch("../partials/header.html");
document.getElementById("header-container").innerHTML = await header.text();
await initHeader();

const sidebar = await fetch("../partials/sidebar.html");
document.getElementById("sidebar-container").innerHTML = await sidebar.text();
initSidebar();

const nav = await fetch("../partials/nav.html");
document.getElementById("navbar-container").innerHTML = await nav.text();

await import("../partials/js/nav.js");

initDashboard();

}catch(error){

console.error("Erreur chargement dashboard :",error);

}

}

initApp();



function initDashboard(){

const participationCanvas=document.getElementById("participationChart");

if(participationCanvas){

const participation=75;

const ctx=participationCanvas.getContext("2d");

const percentageLabel=document.getElementById("percentageLabel");

if(percentageLabel){
percentageLabel.innerText=participation+"%";
}

new Chart(ctx,{

type:"doughnut",

data:{
datasets:[{
data:[participation,100-participation],
backgroundColor:[
"#54ACBF",
"#023859"
],
borderWidth:0
}]
},

options:{

rotation:-90,
circumference:180,
cutout:"75%",

plugins:{
tooltip:{enabled:false},
legend:{display:false}
}

}

});

}

const routes={
btnMessage:"../chat/index.html",
btnAgenda:"agenda.html",
btnPublication:"../posts/index.html",
btnPresenceRoom:"../users/presence.html",
btnJustification:"justification.html"
};

Object.keys(routes).forEach(id=>{

const btn=document.getElementById(id);

if(btn){

btn.addEventListener("click",()=>{
window.location.href=routes[id];
});

}

});

}

</script>


<script>

const slider = document.getElementById("quickActions");

if(slider){

slider.addEventListener("wheel",function(e){

e.preventDefault();
slider.scrollLeft += e.deltaY;

});

}

</script>


<script type="module" src="../mains.js/app-init.js"></script>

</body>
</html>
