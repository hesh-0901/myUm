<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - MyUm</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#1A3668',
        medium: '#2596D9',
        lightblue: '#3FA9F5'
      },
      fontFamily: {
        display: ['Inter','sans-serif']
      }
    }
  }
}
</script>

</head>

<body class="bg-gray-100 font-display text-gray-800 pb-24 pt-20">

<!-- HEADER -->
<div class="px-4 max-w-md mx-auto flex items-center justify-between mb-6">

<div>
<p class="text-sm text-gray-500">Bienvenue</p>
<p id="usernameDisplay" class="font-semibold text-lg"></p>
</div>

<div class="flex items-center gap-3">

<button class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center">
<i class="bi bi-search"></i>
</button>

<img src="https://i.pravatar.cc/40"
class="w-10 h-10 rounded-full shadow">

</div>

</div>


<!-- CONTENU -->
<div class="px-4 space-y-6 max-w-md mx-auto">


<!-- ACTIONS RAPIDES SCROLLABLES -->
<div class="flex gap-3 overflow-x-auto pb-2">

<button
class="flex flex-col items-center min-w-[80px] gap-2 bg-white shadow rounded-2xl p-3">

<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<i class="bi bi-chat-dots text-primary"></i>
</div>

<span class="text-xs font-medium">Message</span>

</button>


<button
class="flex flex-col items-center min-w-[80px] gap-2 bg-white shadow rounded-2xl p-3">

<div class="w-10 h-10 rounded-full bg-medium/10 flex items-center justify-center">
<i class="bi bi-calendar-week text-medium"></i>
</div>

<span class="text-xs font-medium">Agenda</span>

</button>


<button
class="flex flex-col items-center min-w-[80px] gap-2 bg-white shadow rounded-2xl p-3">

<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<i class="bi bi-pencil-square text-primary"></i>
</div>

<span class="text-xs font-medium">Publication</span>

</button>


<button
class="flex flex-col items-center min-w-[80px] gap-2 bg-white shadow rounded-2xl p-3">

<div class="w-10 h-10 rounded-full bg-medium/10 flex items-center justify-center">
<i class="bi bi-clipboard-check text-medium"></i>
</div>

<span class="text-xs font-medium">Présence</span>

</button>


<button
class="flex flex-col items-center min-w-[80px] gap-2 bg-white shadow rounded-2xl p-3">

<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<i class="bi bi-file-earmark-text text-primary"></i>
</div>

<span class="text-xs font-medium">Justifier</span>

</button>

</div>



<!-- CARTE PARTICIPATION -->
<div class="bg-white rounded-3xl shadow-md p-6">

<div class="flex items-center justify-between mb-4">

<h2 class="font-semibold text-sm">
Taux de participation
</h2>

<i class="bi bi-three-dots text-gray-400"></i>

</div>


<div class="flex justify-center relative">

<canvas id="participationChart" width="200" height="200"></canvas>

<div class="absolute text-2xl font-bold text-primary top-1/2 -translate-y-1/2">
87%
</div>

</div>

</div>



<!-- CARTE EVOLUTION -->
<div class="bg-white rounded-3xl shadow-md p-6">

<div class="flex items-center justify-between mb-4">

<h2 class="font-semibold text-sm">
Evolution participation
</h2>

<span class="text-xs text-gray-400">
6 derniers mois
</span>

</div>

<canvas id="evolutionChart" height="120"></canvas>

</div>



<!-- INFORMATIONS -->
<div class="grid grid-cols-2 gap-4">

<div class="bg-white rounded-2xl shadow p-4">

<p class="text-xs text-gray-500 mb-1">
Présences
</p>

<p class="text-lg font-semibold">
87
</p>

</div>

<div class="bg-white rounded-2xl shadow p-4">

<p class="text-xs text-gray-500 mb-1">
Absences
</p>

<p class="text-lg font-semibold text-red-500">
13
</p>

</div>

</div>


</div>


<!-- SCRIPT -->
<script src="../public/js/dashboard.js"></script>

</body>
</html>
